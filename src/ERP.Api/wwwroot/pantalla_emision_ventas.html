<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Ventas — Responsable: María -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de venta - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // POS: catálogo de caja (GET /api/ventas/catalogo: precio y stock, sin costos), clientes (GET/POST /api/clientes)
        // y emisión (POST /api/ventas). Stock, IVA, kardex y asientos los calcula el backend en una transacción.
        const { useState, useMemo } = React;
        const IVA = 0.19;
        const METODOS = [
            { id: 'Efectivo', texto: '💵 Efectivo' }, { id: 'Tarjeta', texto: '💳 Tarjeta (débito/crédito)' },
            { id: 'Transferencia', texto: '🏦 Transferencia' }, { id: 'Credito', texto: '⏳ Crédito 30 días' }
        ];

        function Pos() {
            const catalogo = useApi('/api/ventas/catalogo', []);
            const clientes = useApi('/api/clientes', []);
            const [busqueda, setBusqueda] = useState('');
            const [busquedaCliente, setBusquedaCliente] = useState('');
            const [cliente, setCliente] = useState(null);
            const [metodo, setMetodo] = useState('Efectivo');
            const [tipoDoc, setTipoDoc] = useState('BOLETA');
            const [lineas, setLineas] = useState([]);
            const [emitiendo, setEmitiendo] = useState(false);
            const [comprobante, setComprobante] = useState(null);
            const [nuevoCliente, setNuevoCliente] = useState(null);
            const puedeCrearCliente = ErpAuth.tienePermiso('ventas.clientes.crear');
            const puedeEditarCliente = ErpAuth.tienePermiso('ventas.clientes.escribir');

            // Búsqueda por similitud (buscarSimilares, en shared/erp-ui.jsx): lo más parecido primero.
            const productos = useMemo(() => buscarSimilares(catalogo.datos || [], busqueda, p => [p.nombre, p.sku, p.categoria || ''], 40), [catalogo.datos, busqueda]);
            const clientesFiltrados = useMemo(() => !busquedaCliente.trim() ? [] :
                buscarSimilares((clientes.datos || []).filter(c => c.activo !== false), busquedaCliente, c => [c.razonSocial, c.rut, c.email || '', c.telefono || ''], 8), [clientes.datos, busquedaCliente]);

            const enCarro = (id) => lineas.find(l => l.productoId === id);
            const agregar = (p) => {
                const actual = enCarro(p.id);
                const cantidad = (actual ? actual.cantidad : 0) + 1;
                if (cantidad > p.stock) { mostrarToast(`Stock insuficiente de ${p.nombre}: disponible ${formatNumero(p.stock)}.`, 'aviso'); return; }
                setLineas(actual ? lineas.map(l => l.productoId === p.id ? { ...l, cantidad, cantidadTxt: String(cantidad) } : l)
                    : [...lineas, { productoId: p.id, sku: p.sku, nombre: p.nombre, precio: p.precioVenta, stock: p.stock, cantidad: 1, descuentoPct: 0 }]);
            };
            const cambiarLinea = (id, campo, valor) => setLineas(lineas.map(l => {
                if (l.productoId !== id) return l;
                // Texto limpio: solo dígitos y un punto decimal, sin ceros a la izquierda (05 → 5).
                let txt = String(valor).replace(',', '.').replace(/[^0-9.]/g, '').replace(/^(\d*\.\d*)\..*$/, '$1').replace(/^0+(?=\d)/, '');
                let v = Math.max(0, Number(txt) || 0);
                if (campo === 'cantidad' && v > l.stock) { mostrarToast(`Solo hay ${formatNumero(l.stock)} unidades de ${l.nombre}.`, 'aviso'); v = l.stock; txt = String(v); }
                if (campo === 'descuentoPct' && v > 100) { v = 100; txt = '100'; }
                return { ...l, [campo]: v, [campo + 'Txt']: txt };
            }));

            const totales = useMemo(() => {
                const bruto = lineas.reduce((s, l) => s + l.precio * l.cantidad, 0);
                const descuento = lineas.reduce((s, l) => s + Math.round(l.precio * l.cantidad * l.descuentoPct / 100), 0);
                // Los precios del catálogo YA incluyen IVA: el cliente paga exactamente la suma de los precios (menos descuentos).
                const total = bruto - descuento;
                const neto = Math.round(total / (1 + IVA));
                return { bruto, descuento, neto, iva: total - neto, total };
            }, [lineas]);

            // Al dejar de pagar a crédito se descarta el cliente (solo sirve para esa modalidad).
            const cambiarMetodo = (nuevo) => { setMetodo(nuevo); if (nuevo !== 'Credito') { setCliente(null); setBusquedaCliente(''); } };
            const creditoDisponible = cliente ? cliente.limiteCredito - cliente.saldoPendiente : 0;
            const excedeCredito = metodo === 'Credito' && cliente && totales.total > creditoDisponible;
            // El cliente es opcional (consumidor final), salvo en ventas a crédito.
            const creditoSinCliente = metodo === 'Credito' && !cliente;
            const bloqueado = lineas.length === 0 || lineas.some(l => l.cantidad <= 0) || excedeCredito || creditoSinCliente;

            const emitir = async () => {
                const ok = await confirmar({
                    titulo: `Emitir ${tipoDoc.toLowerCase()}`, textoConfirmar: 'Emitir',
                    mensaje: `Cliente: ${cliente ? cliente.razonSocial : 'Consumidor final (sin cliente)'}\nPago: ${METODOS.find(m => m.id === metodo).texto}\nTotal: ${formatCLP(totales.total)} (IVA incluido)`
                });
                if (!ok) return;
                setEmitiendo(true);
                try {
                    const venta = await apiFetch('/api/ventas', { method: 'POST', body: {
                        clienteId: cliente ? cliente.id : null, metodoPago: metodo, observaciones: `Documento: ${tipoDoc}`,
                        items: lineas.map(l => ({ productoId: l.productoId, cantidad: l.cantidad, precioUnitario: l.precio, descuento: Math.round(l.precio * l.cantidad * l.descuentoPct / 100) })) } });
                    setComprobante({ venta, lineas, cliente, metodo, tipoDoc });
                    setLineas([]); setCliente(null); setMetodo('Efectivo'); setBusquedaCliente('');
                    catalogo.recargar(); clientes.recargar();
                } catch (err) { mostrarToast('No se pudo emitir: ' + err.message, 'error'); }
                finally { setEmitiendo(false); }
            };

            // Abre el formulario con los datos del cliente seleccionado (el PUT reemplaza todos los campos, por eso se cargan todos).
            const editarCliente = () => setNuevoCliente({
                id: cliente.id, rut: cliente.rut || '', razonSocial: cliente.razonSocial || '', email: cliente.email || '', telefono: cliente.telefono || '',
                contacto: cliente.contacto || '', direccion: cliente.direccion || '', limiteCredito: cliente.limiteCredito || 0
            });
            // Crea (sin id) o actualiza (con id) el cliente y lo deja seleccionado.
            const guardarCliente = async (e) => {
                e.preventDefault();
                if (!validarRut(nuevoCliente.rut)) { mostrarToast('RUT inválido.', 'error'); return; }
                const editando = !!nuevoCliente.id;
                const cuerpo = {
                    rut: formatearRut(nuevoCliente.rut), razonSocial: nuevoCliente.razonSocial.trim().toUpperCase(), email: nuevoCliente.email.trim(),
                    telefono: nuevoCliente.telefono || null, contacto: nuevoCliente.contacto || null, direccion: nuevoCliente.direccion || null,
                    limiteCredito: Number(nuevoCliente.limiteCredito) || 0
                };
                try {
                    const c = await apiFetch(editando ? `/api/clientes/${nuevoCliente.id}` : '/api/clientes', { method: editando ? 'PUT' : 'POST', body: cuerpo });
                    mostrarToast(`Cliente ${c.razonSocial} ${editando ? 'actualizado' : 'creado'}.`, 'exito');
                    setCliente(c); setNuevoCliente(null); clientes.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
            };

            return (
                <Pagina subtitulo="Venta con validación de stock en línea, precios con IVA incluido y contabilización automática."
                    acciones={<a className="btn btn-secundario" href={ErpAuth.puedeVer('pantalla_caja_inicio.html') ? 'pantalla_caja_inicio.html' : 'pantalla_historial_directas.html'}>📋 Mis ventas</a>}>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        {/* Catálogo */}
                        <Card titulo="Productos" className="lg:col-span-2" acciones={<Buscador valor={busqueda} onCambio={setBusqueda} placeholder="Buscar por SKU o nombre" />}>
                            {catalogo.cargando ? <Cargando /> : productos.length === 0 ? <Vacio icono="🔍" titulo="Sin coincidencias" /> : (
                                <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-3">
                                    {productos.map(p => {
                                        const reservado = enCarro(p.id)?.cantidad || 0;
                                        const disponible = p.stock - reservado;
                                        const sinStock = disponible <= 0;
                                        return (
                                            <button key={p.id} type="button" onClick={() => agregar(p)} disabled={sinStock}
                                                className={`text-left rounded-lg border p-3 transition ${sinStock ? 'opacity-50 cursor-not-allowed bg-slate-50' : 'hover:border-emerald-500 hover:shadow-sm bg-white'}`}
                                                aria-label={`Agregar ${p.nombre}, stock ${disponible}`}>
                                                <div className="flex justify-between gap-2"><span className="font-mono text-xs text-slate-500">{p.sku}</span>
                                                    {sinStock ? <Badge tono="rojo">Sin stock</Badge> : disponible <= p.puntoReorden ? <Badge tono="naranjo">Quedan {formatNumero(disponible)}</Badge> : <Badge tono="verde">Stock {formatNumero(disponible)}</Badge>}
                                                </div>
                                                <div className="font-semibold mt-1 leading-tight">{p.nombre}</div>
                                                <div className="mod-texto font-bold mt-1">{formatCLP(p.precioVenta)} <span className="text-xs text-slate-400 font-normal">IVA incl.</span></div>
                                            </button>
                                        );
                                    })}
                                </div>
                            )}
                        </Card>

                        {/* Comprobante en curso */}
                        <div className="space-y-4">
                            <Card titulo={`Detalle (${lineas.length})`} sinPadding>
                                {lineas.length === 0 ? <Vacio icono="🛒" titulo="Carro vacío" texto="Haga clic en un producto para agregarlo." /> : (
                                    <ul className="divide-y">
                                        {lineas.map(l => (
                                            <li key={l.productoId} className="p-3 text-sm">
                                                <div className="flex justify-between gap-2"><span className="font-semibold">{l.nombre}</span>
                                                    <button className="text-rose-600 text-xs" onClick={() => setLineas(lineas.filter(x => x.productoId !== l.productoId))} aria-label={`Quitar ${l.nombre}`}>Quitar</button></div>
                                                <div className="grid grid-cols-3 gap-2 mt-2 items-end">
                                                    <Campo etiqueta="Cant." id={`c-${l.productoId}`}><input id={`c-${l.productoId}`} type="text" inputMode="decimal" className="erp-input" value={l.cantidadTxt ?? l.cantidad} onFocus={e => e.target.select()} onChange={e => cambiarLinea(l.productoId, 'cantidad', e.target.value)} /></Campo>
                                                    <Campo etiqueta="Dcto %" id={`d-${l.productoId}`}><input id={`d-${l.productoId}`} type="text" inputMode="decimal" className="erp-input" value={l.descuentoPctTxt ?? l.descuentoPct} onFocus={e => e.target.select()} onChange={e => cambiarLinea(l.productoId, 'descuentoPct', e.target.value)} /></Campo>
                                                    <div className="text-right font-semibold pb-2">{formatCLP(l.precio * l.cantidad * (1 - l.descuentoPct / 100))}</div>
                                                </div>
                                            </li>
                                        ))}
                                    </ul>
                                )}
                            </Card>

                            <Card titulo="Pago">
                                <div className="grid grid-cols-2 gap-3 mb-3">
                                    <Campo etiqueta="Documento" id="pos-doc">
                                        <select id="pos-doc" className="erp-input" value={tipoDoc} onChange={e => setTipoDoc(e.target.value)}><option>BOLETA</option><option>FACTURA</option></select>
                                    </Campo>
                                    <Campo etiqueta="Forma de pago" id="pos-pago">
                                        <select id="pos-pago" className="erp-input" value={metodo} onChange={e => cambiarMetodo(e.target.value)}>
                                            {METODOS.map(m => <option key={m.id} value={m.id}>{m.texto}</option>)}
                                        </select>
                                    </Campo>
                                </div>
                                {/* El cliente solo se pide en ventas a crédito */}
                                {metodo === 'Credito' && (
                                    <div className="mb-3 p-3 rounded-lg border border-amber-300 bg-amber-50">
                                        <div className="font-semibold text-sm mb-2">Cliente (obligatorio para crédito)</div>
                                        {cliente ? (
                                            <div className="flex items-start justify-between gap-2">
                                                <div><div className="font-semibold">{cliente.razonSocial}</div><div className="text-xs font-mono text-slate-500">{cliente.rut}</div>
                                                    <div className="text-xs mt-1">Crédito disponible: <strong>{formatCLP(creditoDisponible)}</strong> <span className="text-slate-500">(límite {formatCLP(cliente.limiteCredito)} − deuda {formatCLP(cliente.saldoPendiente)})</span></div></div>
                                                <div className="flex flex-col gap-1">
                                                    {puedeEditarCliente && <button type="button" className="btn btn-secundario btn-chico" onClick={editarCliente}>✏️ Editar</button>}
                                                    <button type="button" className="btn btn-secundario btn-chico" onClick={() => setCliente(null)}>Cambiar</button>
                                                </div>
                                            </div>
                                        ) : (
                                            <div className="space-y-2">
                                                <Buscador valor={busquedaCliente} onCambio={setBusquedaCliente} placeholder="Nombre, RUT, email o teléfono" etiqueta="Buscar cliente" />
                                                {busquedaCliente.trim() && clientesFiltrados.length === 0 && <p className="text-xs text-slate-500 px-1">Sin coincidencias. Revise lo escrito{puedeCrearCliente ? ' o cree el cliente nuevo.' : '.'}</p>}
                                                {clientesFiltrados.map(c => (
                                                    <button key={c.id} type="button" className="w-full text-left px-3 py-2 rounded border bg-white hover:bg-emerald-50 text-sm" onClick={() => setCliente(c)}>
                                                        <strong>{c.razonSocial}</strong> <span className="font-mono text-xs text-slate-500">{c.rut}</span>
                                                    </button>
                                                ))}
                                                {puedeCrearCliente && <button type="button" className="btn btn-secundario btn-chico" onClick={() => setNuevoCliente({ rut: '', razonSocial: '', email: '', telefono: '', contacto: '', direccion: '', limiteCredito: 0 })}>➕ Cliente nuevo</button>}
                                            </div>
                                        )}
                                    </div>
                                )}
                                <dl className="text-sm space-y-1">
                                    <div className="flex justify-between"><dt>Subtotal</dt><dd>{formatCLP(totales.bruto)}</dd></div>
                                    {totales.descuento > 0 && <div className="flex justify-between text-rose-700"><dt>Descuentos</dt><dd>−{formatCLP(totales.descuento)}</dd></div>}
                                    <div className="flex justify-between text-xl font-extrabold mod-texto pt-2 border-t"><dt>Total a pagar</dt><dd>{formatCLP(totales.total)}</dd></div>
                                    <div className="flex justify-between text-xs text-slate-500 pt-1"><dt>Incluye IVA 19%</dt><dd>{formatCLP(totales.iva)}</dd></div>
                                    <div className="flex justify-between text-xs text-slate-500"><dt>Neto (sin IVA)</dt><dd>{formatCLP(totales.neto)}</dd></div>
                                </dl>
                                {creditoSinCliente && <p className="erp-error mt-2">Para vender a crédito seleccione un cliente registrado.</p>}
                                {excedeCredito && <p className="erp-error mt-2">El total supera el crédito disponible del cliente.</p>}
                                <Boton className="w-full mt-4 text-lg py-3" onClick={emitir} cargando={emitiendo} disabled={bloqueado}>✓ Emitir {tipoDoc.toLowerCase()}</Boton>
                            </Card>
                        </div>
                    </div>

                    <Modal abierto={!!nuevoCliente} titulo={nuevoCliente && nuevoCliente.id ? 'Editar cliente' : 'Cliente nuevo'} onCerrar={() => setNuevoCliente(null)}
                        pie={<><button className="btn btn-secundario" onClick={() => setNuevoCliente(null)}>Cancelar</button><button type="submit" form="form-cli" className="btn btn-primario">{nuevoCliente && nuevoCliente.id ? 'Guardar cambios' : 'Crear y seleccionar'}</button></>}>
                        {nuevoCliente && (
                            <form id="form-cli" onSubmit={guardarCliente} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Campo etiqueta="RUT *" id="nc-rut" error={nuevoCliente.rut.length >= 8 && !validarRut(nuevoCliente.rut) ? 'RUT inválido' : null}><input id="nc-rut" className="erp-input font-mono" value={nuevoCliente.rut} onChange={e => setNuevoCliente({ ...nuevoCliente, rut: e.target.value })} required /></Campo>
                                <Campo etiqueta="Nombre / razón social *" id="nc-nom"><input id="nc-nom" className="erp-input" value={nuevoCliente.razonSocial} onChange={e => setNuevoCliente({ ...nuevoCliente, razonSocial: e.target.value })} required /></Campo>
                                <Campo etiqueta="Email *" id="nc-mail"><input id="nc-mail" type="email" className="erp-input" value={nuevoCliente.email} onChange={e => setNuevoCliente({ ...nuevoCliente, email: e.target.value })} required /></Campo>
                                <Campo etiqueta="Teléfono" id="nc-tel"><input id="nc-tel" className="erp-input" value={nuevoCliente.telefono} onChange={e => setNuevoCliente({ ...nuevoCliente, telefono: e.target.value })} /></Campo>
                                <Campo etiqueta="Contacto" id="nc-cont"><input id="nc-cont" className="erp-input" value={nuevoCliente.contacto || ''} onChange={e => setNuevoCliente({ ...nuevoCliente, contacto: e.target.value })} /></Campo>
                                <Campo etiqueta="Dirección" id="nc-dir"><input id="nc-dir" className="erp-input" value={nuevoCliente.direccion || ''} onChange={e => setNuevoCliente({ ...nuevoCliente, direccion: e.target.value })} /></Campo>
                                <Campo etiqueta="Límite de crédito (CLP)" id="nc-lim" ayuda={nuevoCliente.id ? `El crédito disponible es el límite menos la deuda actual (${formatCLP(cliente ? cliente.saldoPendiente : 0)}). 0 = solo contado.` : '0 = solo ventas al contado.'}><input id="nc-lim" type="number" min="0" className="erp-input" value={nuevoCliente.limiteCredito} onChange={e => setNuevoCliente({ ...nuevoCliente, limiteCredito: e.target.value.replace(/^0+(?=\d)/, '') })} /></Campo>
                            </form>
                        )}
                    </Modal>

                    <Modal abierto={!!comprobante} imprimible titulo="Venta emitida" onCerrar={() => setComprobante(null)}
                        pie={<><button className="btn btn-secundario" onClick={() => window.print()}>🖨️ Imprimir</button><button className="btn btn-primario" onClick={() => setComprobante(null)}>Nueva venta</button></>}>
                        {comprobante && (
                            <div className="text-sm space-y-2">
                                <div className="text-center"><div className="text-4xl">✅</div>
                                    <div className="font-extrabold text-lg">{comprobante.tipoDoc} {comprobante.venta.numeroFactura}</div>
                                    <div>{comprobante.cliente ? comprobante.cliente.razonSocial : 'Consumidor final'} · {comprobante.metodo}</div></div>
                                <table className="erp-tabla"><tbody>
                                    {comprobante.lineas.map(l => <tr key={l.productoId}><td>{l.cantidad} × {l.nombre}</td><td className="num">{formatCLP(l.precio * l.cantidad * (1 - l.descuentoPct / 100))}</td></tr>)}
                                </tbody><tfoot><tr><td>Total pagado</td><td className="num">{formatCLP(comprobante.venta.total)}</td></tr><tr><td className="text-xs">Neto</td><td className="num text-xs">{formatCLP(comprobante.venta.subtotal)}</td></tr><tr><td className="text-xs">IVA 19% (incluido en el total)</td><td className="num text-xs">{formatCLP(comprobante.venta.impuestoIva)}</td></tr></tfoot></table>
                                {comprobante.venta.saldoPendiente > 0 && <p className="text-amber-800">Saldo a crédito: {formatCLP(comprobante.venta.saldoPendiente)} · vence {formatFecha(comprobante.venta.fechaVencimiento)}</p>}
                            </div>
                        )}
                    </Modal>
                </Pagina>
            );
        }

        montar(Pos);
    </script>
</body>
</html>
