<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Integración — Responsable: Cristóbal -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integración contable - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        const { useState } = React;
        // Matriz de integración contable editable (GET/POST/PUT /api/integracion/matriz) y referencia de las cuentas fijas en código
        // y salud de la integración: GET /api/integracion/configuracion y GET /api/integracion/estado.
        const TONO_MODULO = { Compras: 'amarillo', Ventas: 'verde', Inventario: 'azul', Contabilidad: 'violeta' };

        function Cuentas({ lista }) {
            return <div className="space-y-1">{lista.map(c => (
                <div key={c.codigo} className="text-xs flex items-center gap-1">
                    <span className="font-mono font-semibold">{c.codigo}</span>
                    {c.existe ? <span>{c.nombre}</span> : <Badge tono="rojo">No existe en el plan</Badge>}
                </div>))}</div>;
        }

        function Integracion() {
            const config = useApi('/api/integracion/configuracion', null);
            const estado = useApi('/api/integracion/estado', null);
            const matriz = useApi('/api/integracion/matriz', []);
            const cuentas = useApi('/api/maestros/cuentas-contables', []);
            const puedeEditar = ErpAuth.tienePermiso('contabilidad.cuentas.escribir');
            const [form, setForm] = useState(null);
            const [guardando, setGuardando] = useState(false);
            const cuentasMov = (cuentas.datos || []).filter(c => c.permiteMovimiento && c.activo !== false);
            const guardar = async (e) => {
                e.preventDefault();
                setGuardando(true);
                try {
                    const cuerpo = { cuentaDebeId: Number(form.cuentaDebeId), cuentaHaberId: Number(form.cuentaHaberId), descripcion: form.descripcion || null };
                    if (form.id) await apiFetch(`/api/integracion/matriz/${form.id}`, { method: 'PUT', body: { ...cuerpo, activo: form.activo } });
                    else await apiFetch('/api/integracion/matriz', { method: 'POST', body: { ...cuerpo, moduloOrigen: form.moduloOrigen.trim(), tipoOperacion: form.tipoOperacion.trim() } });
                    mostrarToast('Matriz actualizada.', 'exito');
                    setForm(null);
                    matriz.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
                finally { setGuardando(false); }
            };
            const e = estado.datos;
            const faltantes = (config.datos?.operaciones || []).flatMap(o => [...o.debe, ...o.haber]).filter(c => !c.existe).length;

            return (
                <Pagina subtitulo="Cómo cada módulo genera sus asientos automáticos y si la centralización está sana."
                    acciones={<Boton variante="secundario" onClick={() => { config.recargar(); estado.recargar(); }}>🔄 Actualizar</Boton>}>
                    <Kpis>
                        <Kpi icono="🗄️" titulo="Base de datos" valor={e ? (e.baseDeDatos ? 'Conectada' : 'Sin conexión') : '—'} tono={e?.baseDeDatos ? 'verde' : 'rojo'} cargando={estado.cargando} />
                        <Kpi icono="🧾" titulo="IVA aplicado" valor={config.datos ? `${Math.round(config.datos.tasaIva * 100)}%` : '—'} tono="azul" cargando={config.cargando} />
                        <Kpi icono="🔗" titulo="Cuentas faltantes" valor={faltantes} tono={faltantes ? 'rojo' : 'verde'} detalle="Cuentas de la matriz que no están en el plan" cargando={config.cargando} />
                        <Kpi icono="⚠️" titulo="Pendientes de contabilizar" valor={e ? e.ventasSinAsiento + e.facturasCompraSinAsiento : '—'} detalle={e ? `${e.asientosDescuadrados} asientos descuadrados` : ''} tono={e && (e.ventasSinAsiento + e.facturasCompraSinAsiento + e.asientosDescuadrados) ? 'amarillo' : 'verde'} cargando={estado.cargando} />
                    </Kpis>

                    <Card sinPadding titulo="Matriz de integración contable (configurable)" className="mb-6"
                        acciones={puedeEditar && <Boton className="btn-chico" onClick={() => setForm({ id: 0, moduloOrigen: '', tipoOperacion: '', descripcion: '', cuentaDebeId: '', cuentaHaberId: '', activo: true })}>➕ Nueva operación</Boton>}>
                        <Tabla filas={matriz.datos} cargando={matriz.cargando} claveFila={m => m.id} vacio={<Vacio icono="🧩" titulo="Matriz vacía" texto="Se siembra al iniciar la API a partir de las cuentas fijas." />} columnas={[
                            { titulo: 'Módulo', render: m => <Badge tono={TONO_MODULO[m.moduloOrigen] || 'gris'}>{m.moduloOrigen}</Badge> },
                            { titulo: 'Operación', render: m => <div><span className="font-mono font-semibold text-xs">{m.tipoOperacion}</span><div className="text-xs text-slate-500">{m.descripcion}</div></div> },
                            { titulo: 'Debe', render: m => <span className="text-xs"><span className="font-mono font-semibold">{m.cuentaDebeCodigo}</span> {m.cuentaDebeNombre}</span> },
                            { titulo: 'Haber', render: m => <span className="text-xs"><span className="font-mono font-semibold">{m.cuentaHaberCodigo}</span> {m.cuentaHaberNombre}</span> },
                            { titulo: 'Estado', render: m => m.activo ? <Badge tono="verde">Activa</Badge> : <Badge tono="gris">Inactiva</Badge> },
                            { titulo: '', render: m => puedeEditar && <button className="btn btn-secundario btn-chico" onClick={() => setForm({ ...m })} aria-label={`Editar ${m.tipoOperacion}`}>✏️</button> }
                        ]} />
                        <p className="text-xs text-slate-500 p-4">Esta matriz guarda, por operación, la cuenta del Debe y la del Haber (se siembra desde las cuentas fijas del sistema). Hoy la consume el <strong>pago a proveedores</strong>; las demás operaciones (ventas, factura de compra, ajustes) siguen usando las cuentas fijas del código mostradas abajo hasta que se conecten a esta matriz.</p>
                    </Card>

                    <Card sinPadding titulo="Referencia: cuentas fijas en el código (CuentasContablesConst)" className="mb-6">
                        <Tabla filas={config.datos?.operaciones} cargando={config.cargando} claveFila={o => o.operacion} columnas={[
                            { titulo: 'Operación', render: o => <span className="font-semibold">{o.operacion}</span> },
                            { titulo: 'Módulo', render: o => <Badge tono={TONO_MODULO[o.modulo]}>{o.modulo}</Badge> },
                            { titulo: 'Responsable', campo: 'responsable' },
                            { titulo: 'Debe', render: o => <Cuentas lista={o.debe} /> },
                            { titulo: 'Haber', render: o => <Cuentas lista={o.haber} /> }
                        ]} />
                        <p className="text-xs text-slate-500 p-4">Cuentas que usan hoy los asientos automáticos de ventas, compras e inventario (<code>CuentasContablesConst</code>); fueron la semilla de la matriz configurable de arriba.</p>
                    </Card>

                    <Card sinPadding titulo="Asientos por módulo de origen">
                        <Tabla filas={e?.asientosPorModulo} cargando={estado.cargando} claveFila={m => m.modulo} vacio={<Vacio icono="📭" titulo="Aún no hay asientos" />} columnas={[
                            { titulo: 'Módulo', render: m => <Badge tono={TONO_MODULO[m.modulo] || 'gris'}>{m.modulo}</Badge> },
                            { titulo: 'Asientos', num: true, campo: 'cantidad' },
                            { titulo: 'Último', render: m => formatFecha(m.ultimo, true) }
                        ]} />
                    </Card>

                    <Modal abierto={!!form} titulo={form?.id ? `Editar ${form.tipoOperacion}` : 'Nueva operación'} onCerrar={() => setForm(null)}
                        pie={<><button className="btn btn-secundario" onClick={() => setForm(null)}>Cancelar</button><Boton type="submit" form="form-matriz" cargando={guardando}>Guardar</Boton></>}>
                        {form && (
                            <form id="form-matriz" onSubmit={guardar} className="space-y-4">
                                {!form.id && <div className="grid grid-cols-2 gap-4">
                                    <Campo etiqueta="Módulo *" id="mx-mod"><input id="mx-mod" className="erp-input" maxLength="50" value={form.moduloOrigen} onChange={e => setForm({ ...form, moduloOrigen: e.target.value })} required /></Campo>
                                    <Campo etiqueta="Operación *" id="mx-op"><input id="mx-op" className="erp-input" maxLength="100" value={form.tipoOperacion} onChange={e => setForm({ ...form, tipoOperacion: e.target.value })} required /></Campo>
                                </div>}
                                <Campo etiqueta="Cuenta del Debe *" id="mx-debe">
                                    <select id="mx-debe" className="erp-input" value={form.cuentaDebeId} onChange={e => setForm({ ...form, cuentaDebeId: e.target.value })} required>
                                        <option value="">Seleccione...</option>{cuentasMov.map(c => <option key={c.id} value={c.id}>{c.codigo} · {c.nombre}</option>)}
                                    </select>
                                </Campo>
                                <Campo etiqueta="Cuenta del Haber *" id="mx-haber">
                                    <select id="mx-haber" className="erp-input" value={form.cuentaHaberId} onChange={e => setForm({ ...form, cuentaHaberId: e.target.value })} required>
                                        <option value="">Seleccione...</option>{cuentasMov.map(c => <option key={c.id} value={c.id}>{c.codigo} · {c.nombre}</option>)}
                                    </select>
                                </Campo>
                                <Campo etiqueta="Descripción" id="mx-desc"><input id="mx-desc" className="erp-input" maxLength="300" value={form.descripcion || ''} onChange={e => setForm({ ...form, descripcion: e.target.value })} /></Campo>
                                {form.id > 0 && <label className="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" checked={form.activo} onChange={e => setForm({ ...form, activo: e.target.checked })} /> Activa (si se desactiva, se usan las cuentas fijas)</label>}
                            </form>
                        )}
                    </Modal>
                </Pagina>
            );
        }

        montar(Integracion);
    </script>
</body>
</html>
