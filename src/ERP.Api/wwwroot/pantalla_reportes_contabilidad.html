<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Contabilidad — Responsable: Cristóbal -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes contables - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Balance de comprobación (sumas y saldos, agrupado en SQL — K2): GET /api/contabilidad/balance-comprobacion.
        // Centralización por módulo: GET /api/integracion/estado.
        const { useState, useMemo } = React;

        function ReportesContables() {
            const balance = useApi('/api/contabilidad/balance-comprobacion', []);
            const estado = useApi('/api/integracion/estado', null);
            const [soloConMovimiento, setSoloConMovimiento] = useState(true);
            const filas = useMemo(() => (balance.datos || []).filter(f => !soloConMovimiento || f.totalDebe || f.totalHaber), [balance.datos, soloConMovimiento]);
            const sum = (k) => filas.reduce((s, f) => s + f[k], 0);
            const sumasCuadran = Math.abs(sum('totalDebe') - sum('totalHaber')) < 1;
            const saldosCuadran = Math.abs(sum('saldoDeudor') - sum('saldoAcreedor')) < 1;

            return (
                <Pagina subtitulo="Balance de comprobación de sumas y saldos y estado de la centralización por módulo."
                    acciones={<>
                        <Boton variante="secundario" onClick={() => descargarCSV('balance_comprobacion.csv', filas, [
                            { titulo: 'Código', valor: f => f.codigoCuenta }, { titulo: 'Cuenta', valor: f => f.nombreCuenta },
                            { titulo: 'Debe', valor: f => f.totalDebe }, { titulo: 'Haber', valor: f => f.totalHaber },
                            { titulo: 'Saldo deudor', valor: f => f.saldoDeudor }, { titulo: 'Saldo acreedor', valor: f => f.saldoAcreedor }])}>⬇️ CSV</Boton>
                        <Boton onClick={() => window.print()}>🖨️ Imprimir</Boton>
                    </>}>
                    <Kpis>
                        <Kpi icono="⚖️" titulo="Sumas Debe = Haber" valor={sumasCuadran ? 'Cuadran' : 'No cuadran'} detalle={formatCLP(sum('totalDebe'))} tono={sumasCuadran ? 'verde' : 'rojo'} cargando={balance.cargando} />
                        <Kpi icono="🧮" titulo="Saldos deudor = acreedor" valor={saldosCuadran ? 'Cuadran' : 'No cuadran'} detalle={formatCLP(sum('saldoDeudor'))} tono={saldosCuadran ? 'verde' : 'rojo'} cargando={balance.cargando} />
                        <Kpi icono="⚠️" titulo="Asientos descuadrados" valor={estado.datos?.asientosDescuadrados ?? '—'} tono={estado.datos?.asientosDescuadrados ? 'rojo' : 'verde'} cargando={estado.cargando} />
                        <Kpi icono="🔗" titulo="Documentos sin asiento" valor={(estado.datos?.ventasSinAsiento ?? 0) + (estado.datos?.facturasCompraSinAsiento ?? 0)} detalle="Ventas + facturas de compra" tono="amarillo" cargando={estado.cargando} />
                    </Kpis>

                    <Card sinPadding titulo="Balance de comprobación" className="mb-6" acciones={
                        <label className="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" checked={soloConMovimiento} onChange={e => setSoloConMovimiento(e.target.checked)} /> Solo cuentas con movimiento</label>}>
                        <Tabla filas={filas} cargando={balance.cargando} claveFila={f => f.codigoCuenta} vacio={<Vacio icono="📑" titulo="Sin movimientos contables" />} columnas={[
                            { titulo: 'Código', render: f => <span className="font-mono">{f.codigoCuenta}</span> },
                            { titulo: 'Cuenta', campo: 'nombreCuenta' },
                            { titulo: 'Debe', num: true, render: f => formatCLP(f.totalDebe) },
                            { titulo: 'Haber', num: true, render: f => formatCLP(f.totalHaber) },
                            { titulo: 'Saldo deudor', num: true, render: f => f.saldoDeudor ? formatCLP(f.saldoDeudor) : '' },
                            { titulo: 'Saldo acreedor', num: true, render: f => f.saldoAcreedor ? formatCLP(f.saldoAcreedor) : '' }
                        ]} pie={<tr><td colSpan="2" className="num">Totales</td>
                            <td className="num">{formatCLP(sum('totalDebe'))}</td><td className="num">{formatCLP(sum('totalHaber'))}</td>
                            <td className="num">{formatCLP(sum('saldoDeudor'))}</td><td className="num">{formatCLP(sum('saldoAcreedor'))}</td></tr>} />
                    </Card>

                    <Card sinPadding titulo="Centralización por módulo">
                        <Tabla filas={estado.datos?.asientosPorModulo} cargando={estado.cargando} claveFila={m => m.modulo} vacio={<Vacio icono="🔗" titulo="Sin asientos" />} columnas={[
                            { titulo: 'Módulo de origen', render: m => <Badge tono="modulo">{m.modulo}</Badge> },
                            { titulo: 'Asientos', num: true, campo: 'cantidad' },
                            { titulo: 'Último asiento', render: m => formatFecha(m.ultimo, true) }
                        ]} />
                    </Card>
                </Pagina>
            );
        }

        montar(ReportesContables);
    </script>
</body>
</html>
