<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Contabilidad — Responsable: Cristóbal -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro mayor - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Vista inicial: todos los movimientos, agrupados por cuenta. Los filtros son opcionales.
        const { useState, useEffect, useMemo } = React;
        const MODULOS = { Contabilidad: 'Manual (Contabilidad)', Ventas: 'Ventas', Compras: 'Compras', Inventario: 'Inventario' };

        function agruparMayor(movimientos, cuentas) {
            const porId = new Map(cuentas.map(c => [Number(c.id), c]));
            const grupos = new Map();
            movimientos.forEach(m => {
                const cuenta = porId.get(Number(m.cuentaContableId)) || m.cuentaContable;
                if (!cuenta) return;
                if (!grupos.has(cuenta.id)) grupos.set(cuenta.id, { cuenta, filas: [] });
                grupos.get(cuenta.id).filas.push(m);
            });
            return [...grupos.values()].sort((a, b) => a.cuenta.codigo.localeCompare(b.cuenta.codigo)).map(g => {
                let saldo = 0;
                g.filas.sort((a, b) => new Date(a.asientoContable.fecha) - new Date(b.asientoContable.fecha)
                    || a.asientoContable.id - b.asientoContable.id || a.id - b.id);
                const filas = g.filas.map(m => {
                    saldo += g.cuenta.naturaleza === 'Deudora' ? m.debe - m.haber : m.haber - m.debe;
                    return { ...m, saldo };
                });
                return { ...g, filas, saldo, debe: filas.reduce((s, m) => s + m.debe, 0), haber: filas.reduce((s, m) => s + m.haber, 0) };
            });
        }

        function LibroMayor() {
            const cuentas = useApi('/api/maestros/cuentas-contables', []);
            const [cuentaId, setCuentaId] = useState('');
            const [desde, setDesde] = useState('');
            const [hasta, setHasta] = useState('');
            const [modulo, setModulo] = useState('');
            const [movs, setMovs] = useState([]);
            const [cargando, setCargando] = useState(true);
            const [error, setError] = useState(null);
            const [version, setVersion] = useState(0);
            const cuenta = (cuentas.datos || []).find(c => c.id === Number(cuentaId));

            useEffect(() => {
                let vigente = true;
                const q = new URLSearchParams();
                if (desde) q.set('desde', desde);
                if (hasta) q.set('hasta', `${hasta}T23:59:59`);
                setCargando(true);
                setError(null);
                setMovs([]);
                const ruta = cuentaId ? `/api/contabilidad/libro-mayor/${cuentaId}` : '/api/contabilidad/libro-diario';
                apiFetch(`${ruta}?${q}`).then(datos => {
                    if (!vigente) return;
                    setMovs(cuentaId ? datos : datos.flatMap(a => (a.detalles || []).map(d => ({
                        ...d, asientoContable: { id: a.id, fecha: a.fecha, numeroAsiento: a.numeroAsiento, glosa: a.glosa, moduloOrigen: a.moduloOrigen }
                    }))));
                }).catch(e => {
                    if (vigente) { setError(e.message); mostrarToast(e.message, 'error'); }
                }).finally(() => { if (vigente) setCargando(false); });
                return () => { vigente = false; };
            }, [cuentaId, desde, hasta, version]);

            // Filtro por módulo de origen del asiento (Ventas, Compras, Inventario o manual de Contabilidad).
            const movsFiltrados = useMemo(() => modulo ? movs.filter(m => m.asientoContable?.moduloOrigen === modulo) : movs, [movs, modulo]);
            const grupos = useMemo(() => agruparMayor(movsFiltrados, cuentas.datos || []), [movsFiltrados, cuentas.datos]);
            const debe = grupos.reduce((s, g) => s + g.debe, 0);
            const haber = grupos.reduce((s, g) => s + g.haber, 0);
            const esperando = cargando || cuentas.cargando;

            return (
                <Pagina titulo="Libro mayor" icono="📒" subtitulo="Movimientos agrupados por cuenta, con saldo acumulado según su naturaleza."
                    acciones={<>
                        <Boton variante="secundario" onClick={() => { cuentas.recargar(); setVersion(v => v + 1); }}>Actualizar</Boton>
                        <Boton variante="secundario" onClick={() => window.print()}>Imprimir</Boton>
                    </>}>
                    <NavegacionContable />
                    <Card className="mb-6">
                        <div className="grid grid-cols-1 sm:grid-cols-5 gap-4">
                            <Campo etiqueta="Cuenta" id="lm-cta" className="sm:col-span-2">
                                <select id="lm-cta" className="erp-input" value={cuentaId} onChange={e => setCuentaId(e.target.value)}>
                                    <option value="">Todas las cuentas</option>
                                    {(cuentas.datos || []).map(c => <option key={c.id} value={c.id}>{c.codigo} · {c.nombre}</option>)}
                                </select>
                            </Campo>
                            <Campo etiqueta="Módulo de origen" id="lm-mod">
                                <select id="lm-mod" className="erp-input" value={modulo} onChange={e => setModulo(e.target.value)}>
                                    <option value="">Todos los módulos</option>
                                    {Object.entries(MODULOS).map(([k, t]) => <option key={k} value={k}>{t}</option>)}
                                </select>
                            </Campo>
                            <Campo etiqueta="Desde" id="lm-desde"><input id="lm-desde" type="date" className="erp-input" value={desde} onChange={e => setDesde(e.target.value)} /></Campo>
                            <Campo etiqueta="Hasta" id="lm-hasta"><input id="lm-hasta" type="date" className="erp-input" value={hasta} onChange={e => setHasta(e.target.value)} /></Campo>
                        </div>
                        <button className="btn btn-secundario btn-chico mt-3" onClick={() => { setCuentaId(''); setDesde(''); setHasta(''); setModulo(''); }}>Limpiar filtros</button>
                    </Card>
                    <Kpis>
                        <Kpi icono="📒" titulo={cuenta ? 'Cuenta' : 'Cuentas con movimientos'} valor={cuenta ? cuenta.codigo : grupos.length} detalle={cuenta ? `${cuenta.nombre} · ${cuenta.naturaleza}` : 'Todas las cuentas, agrupadas por código'} cargando={esperando} />
                        <Kpi icono="⬅️" titulo="Debe período" valor={formatCLP(debe)} tono="azul" cargando={esperando} />
                        <Kpi icono="➡️" titulo="Haber período" valor={formatCLP(haber)} tono="amarillo" cargando={esperando} />
                        {cuenta
                            ? <Kpi icono="💰" titulo="Saldo del período" valor={formatCLP(grupos[0]?.saldo || 0)} detalle={`Saldo actual de la cuenta: ${formatCLP(cuenta.saldoActual)}`} tono="violeta" cargando={esperando} />
                            : <Kpi icono="🧾" titulo="Movimientos" valor={grupos.reduce((s, g) => s + g.filas.length, 0)} detalle="Saldo calculado por separado para cada cuenta" tono="violeta" cargando={esperando} />}
                    </Kpis>
                    {esperando ? <Card><Cargando /></Card> : error || cuentas.error ? <Card><Vacio titulo="No se pudieron cargar los movimientos" texto={error || cuentas.error} /></Card>
                        : grupos.length === 0 ? <Card><Vacio icono="📒" titulo="Sin movimientos" texto="No hay movimientos para los filtros seleccionados." /></Card>
                        : grupos.map(g => <Card key={g.cuenta.id} sinPadding className="mb-6" titulo={`Mayor · ${g.cuenta.codigo} ${g.cuenta.nombre}`}>
                            <p className="text-xs text-slate-500 px-4 py-2">Naturaleza {g.cuenta.naturaleza.toLowerCase()} · Saldo acumulado de los movimientos del período seleccionado.</p>
                            <Tabla filas={g.filas} claveFila={m => m.id} columnas={[
                                { titulo: 'Fecha', render: m => formatFecha(m.asientoContable?.fecha) },
                                { titulo: 'Asiento', render: m => <span className="font-mono font-semibold">{m.asientoContable?.numeroAsiento}</span> },
                                { titulo: 'Módulo', render: m => <Badge tono="modulo">{MODULOS[m.asientoContable?.moduloOrigen] ? m.asientoContable.moduloOrigen : (m.asientoContable?.moduloOrigen || '—')}</Badge> },
                                { titulo: 'Glosa', render: m => <div>{m.asientoContable?.glosa}{m.glosaLinea && <div className="text-xs text-slate-500">{m.glosaLinea}</div>}</div> },
                                { titulo: 'Debe', num: true, render: m => m.debe ? formatCLP(m.debe) : '' },
                                { titulo: 'Haber', num: true, render: m => m.haber ? formatCLP(m.haber) : '' },
                                { titulo: 'Saldo', num: true, render: m => <strong className={m.saldo < 0 ? 'text-rose-700' : ''}>{formatCLP(m.saldo)}</strong> }
                            ]} pie={<tr><td colSpan="4" className="num">Totales de la cuenta</td><td className="num">{formatCLP(g.debe)}</td><td className="num">{formatCLP(g.haber)}</td><td className="num">{formatCLP(g.saldo)}</td></tr>} />
                        </Card>)}
                </Pagina>
            );
        }

        montar(LibroMayor);
    </script>
</body>
</html>
