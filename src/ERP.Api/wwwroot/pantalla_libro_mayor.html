<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Contabilidad — Responsable: Cristóbal -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Libro mayor - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Libro mayor por cuenta: GET /api/contabilidad/libro-mayor/{cuentaId}?desde&hasta.
        // Saldo acumulado según naturaleza: deudora = Debe − Haber; acreedora = Haber − Debe.
        const { useState, useEffect, useMemo } = React;

        function LibroMayor() {
            const cuentas = useApi('/api/maestros/cuentas-contables', []);
            const [cuentaId, setCuentaId] = useState('');
            const [desde, setDesde] = useState('');
            const [hasta, setHasta] = useState('');
            const [movs, setMovs] = useState(null);
            const [cargando, setCargando] = useState(false);
            const cuenta = (cuentas.datos || []).find(c => c.id === Number(cuentaId));

            useEffect(() => {
                if (!cuentaId) { setMovs(null); return; }
                const q = new URLSearchParams();
                if (desde) q.set('desde', desde);
                if (hasta) q.set('hasta', `${hasta}T23:59:59`);
                setCargando(true);
                apiFetch(`/api/contabilidad/libro-mayor/${cuentaId}?${q}`).then(setMovs).catch(e => mostrarToast(e.message, 'error')).finally(() => setCargando(false));
            }, [cuentaId, desde, hasta]);

            const filas = useMemo(() => {
                if (!movs || !cuenta) return [];
                let saldo = 0;
                return movs.map(m => {
                    saldo += cuenta.naturaleza === 'Deudora' ? m.debe - m.haber : m.haber - m.debe;
                    return { ...m, saldo };
                });
            }, [movs, cuenta]);
            const debe = filas.reduce((s, f) => s + f.debe, 0), haber = filas.reduce((s, f) => s + f.haber, 0);

            return (
                <Pagina subtitulo="Movimientos y saldo acumulado de una cuenta."
                    acciones={cuenta && <Boton variante="secundario" onClick={() => window.print()}>🖨️ Imprimir</Boton>}>
                    <Card className="mb-6">
                        <div className="grid grid-cols-1 sm:grid-cols-4 gap-4">
                            <Campo etiqueta="Cuenta" id="lm-cta" className="sm:col-span-2">
                                <select id="lm-cta" className="erp-input" value={cuentaId} onChange={e => setCuentaId(e.target.value)}>
                                    <option value="">Seleccione una cuenta...</option>
                                    {(cuentas.datos || []).map(c => <option key={c.id} value={c.id}>{c.codigo} · {c.nombre}</option>)}
                                </select>
                            </Campo>
                            <Campo etiqueta="Desde" id="lm-desde"><input id="lm-desde" type="date" className="erp-input" value={desde} onChange={e => setDesde(e.target.value)} /></Campo>
                            <Campo etiqueta="Hasta" id="lm-hasta"><input id="lm-hasta" type="date" className="erp-input" value={hasta} onChange={e => setHasta(e.target.value)} /></Campo>
                        </div>
                    </Card>
                    {!cuenta ? <Card><Vacio icono="📒" titulo="Seleccione una cuenta" /></Card> : <>
                        <Kpis>
                            <Kpi icono="🏷️" titulo="Cuenta" valor={cuenta.codigo} detalle={`${cuenta.nombre} · ${cuenta.tipo} · ${cuenta.naturaleza}`} />
                            <Kpi icono="⬅️" titulo="Debe período" valor={formatCLP(debe)} tono="azul" cargando={cargando} />
                            <Kpi icono="➡️" titulo="Haber período" valor={formatCLP(haber)} tono="amarillo" cargando={cargando} />
                            <Kpi icono="⚖️" titulo="Saldo del período" valor={formatCLP(filas.length ? filas[filas.length - 1].saldo : 0)} detalle={`Saldo actual de la cuenta: ${formatCLP(cuenta.saldoActual)}`} tono="violeta" cargando={cargando} />
                        </Kpis>
                        <Card sinPadding titulo={`Mayor · ${cuenta.codigo} ${cuenta.nombre}`}>
                            <Tabla filas={filas} cargando={cargando} vacio={<Vacio icono="🗒️" titulo="Sin movimientos en el período" />} columnas={[
                                { titulo: 'Fecha', render: m => formatFecha(m.asientoContable?.fecha) },
                                { titulo: 'Asiento', render: m => <span className="font-mono font-semibold">{m.asientoContable?.numeroAsiento}</span> },
                                { titulo: 'Glosa', render: m => <div>{m.asientoContable?.glosa}{m.glosaLinea && <div className="text-xs text-slate-500">{m.glosaLinea}</div>}</div> },
                                { titulo: 'Debe', num: true, render: m => m.debe ? formatCLP(m.debe) : '' },
                                { titulo: 'Haber', num: true, render: m => m.haber ? formatCLP(m.haber) : '' },
                                { titulo: 'Saldo', num: true, render: m => <strong className={m.saldo < 0 ? 'text-rose-700' : ''}>{formatCLP(m.saldo)}</strong> }
                            ]} pie={filas.length > 0 && <tr><td colSpan="3" className="num">Totales</td><td className="num">{formatCLP(debe)}</td><td className="num">{formatCLP(haber)}</td><td className="num">{formatCLP(filas[filas.length - 1].saldo)}</td></tr>} />
                        </Card>
                    </>}
                </Pagina>
            );
        }

        montar(LibroMayor);
    </script>
</body>
</html>
