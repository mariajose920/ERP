<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Seguridad — Responsable: Cristóbal -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(135deg, #1e1b4b 0%, #312e81 55%, #4338ca 100%);">
    <main class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="text-center mb-6">
                <span class="text-5xl" aria-hidden="true">🏢</span>
                <h1 class="text-2xl font-extrabold text-slate-900 mt-2">ERP Corporativo</h1>
                <p class="text-sm text-slate-500">Ventas · Compras · Inventario · Contabilidad</p>
            </div>

            <div id="aviso" class="hidden mb-4 rounded-lg px-3 py-2 text-sm" role="status"></div>

            <form id="login-form" class="space-y-4" novalidate>
                <div class="erp-campo">
                    <label for="email">Usuario o email</label>
                    <input type="text" id="email" autocomplete="username" class="erp-input" placeholder="usuario@empresa.cl" required>
                </div>
                <div class="erp-campo">
                    <label for="password">Contraseña</label>
                    <div class="relative">
                        <input type="password" id="password" autocomplete="current-password" class="erp-input" style="padding-right: 3rem" required>
                        <button type="button" id="ver-pass" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-semibold text-indigo-700" aria-label="Mostrar contraseña">Ver</button>
                    </div>
                </div>
                <div id="error-msg" class="hidden erp-error text-sm" role="alert"></div>
                <button type="submit" id="btn-login" class="btn btn-primario w-full py-3 text-base">Ingresar</button>
            </form>

            <!-- Credenciales de demostración: solo se muestran si la API está en Development. -->
            <section id="demo" class="hidden mt-6 rounded-xl border-2 border-dashed border-amber-300 bg-amber-50 p-4" aria-labelledby="demo-titulo">
                <h2 id="demo-titulo" class="text-sm font-extrabold text-amber-900 mb-2">🧪 Credenciales de demostración (solo desarrollo)</h2>
                <ul id="demo-lista" class="space-y-2"></ul>
            </section>
        </div>
        <p class="text-center text-xs text-indigo-200 mt-4">La sesión expira automáticamente; al expirar volverá a esta pantalla.</p>
    </main>

    <script>
        // T2 / ronda 2: login real contra POST /api/auth/login, sesión con rol y permisos, y
        // redirección por rol (Administrador y perfiles de gestión → portal; Cajero → inicio de caja).
        (function () {
            const aviso = document.getElementById('aviso');
            const motivo = new URLSearchParams(location.search).get('motivo');
            const MENSAJES = {
                expirada: ['Su sesión expiró. Ingrese nuevamente.', 'bg-amber-50 text-amber-900 border border-amber-200'],
                sesion: ['Inicie sesión para continuar.', 'bg-indigo-50 text-indigo-900 border border-indigo-200']
            };
            if (MENSAJES[motivo]) {
                aviso.textContent = MENSAJES[motivo][0];
                aviso.className = 'mb-4 rounded-lg px-3 py-2 text-sm ' + MENSAJES[motivo][1];
            }

            // Si ya hay sesión vigente, ir directo al inicio del rol.
            if (ErpAuth.obtenerToken() && ErpAuth.usuarioActual()) {
                location.replace(ErpAuth.paginaInicio());
                return;
            }

            const pass = document.getElementById('password');
            document.getElementById('ver-pass').addEventListener('click', function () {
                const mostrar = pass.type === 'password';
                pass.type = mostrar ? 'text' : 'password';
                this.textContent = mostrar ? 'Ocultar' : 'Ver';
                this.setAttribute('aria-label', mostrar ? 'Ocultar contraseña' : 'Mostrar contraseña');
            });

            document.getElementById('login-form').addEventListener('submit', async function (e) {
                e.preventDefault();
                const errorMsg = document.getElementById('error-msg');
                const boton = document.getElementById('btn-login');
                const email = document.getElementById('email').value.trim();
                errorMsg.classList.add('hidden');
                if (!email || !pass.value) {
                    errorMsg.textContent = 'Ingrese usuario y contraseña.';
                    errorMsg.classList.remove('hidden');
                    return;
                }
                boton.disabled = true;
                boton.textContent = 'Verificando...';
                try {
                    const respuesta = await apiFetch('/api/auth/login', { method: 'POST', body: { email: email, password: pass.value } });
                    ErpAuth.guardarSesion(respuesta);
                    location.href = ErpAuth.paginaInicio();
                } catch (err) {
                    errorMsg.textContent = err.status === 401 ? 'Credenciales incorrectas o usuario inactivo.' : 'No se pudo iniciar sesión: ' + err.message;
                    errorMsg.classList.remove('hidden');
                    boton.disabled = false;
                    boton.textContent = 'Ingresar';
                }
            });

            // Recuadro de demo (la API responde 404 fuera de Development).
            fetch('/api/auth/demo-credenciales').then(r => r.ok ? r.json() : []).then(function (lista) {
                if (!lista || !lista.length) return;
                const ul = document.getElementById('demo-lista');
                lista.forEach(function (c) {
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between gap-2 bg-white rounded-lg border border-amber-200 px-3 py-2';
                    li.innerHTML = '<div class="text-xs"><div class="font-bold text-slate-800"></div><div class="font-mono text-slate-600"></div></div>' +
                        '<button type="button" class="btn btn-secundario btn-chico">Usar</button>';
                    li.querySelector('.font-bold').textContent = c.perfil;
                    li.querySelector('.font-mono').textContent = c.usuario + ' / ' + c.password;
                    li.querySelector('button').setAttribute('aria-label', 'Usar credenciales de ' + c.perfil);
                    li.querySelector('button').addEventListener('click', function () {
                        document.getElementById('email').value = c.usuario;
                        pass.value = c.password;
                        document.getElementById('btn-login').focus();
                    });
                    ul.appendChild(li);
                });
                document.getElementById('demo').classList.remove('hidden');
            }).catch(function () { /* sin recuadro de demo */ });
        })();
    </script>
</body>
</html>
