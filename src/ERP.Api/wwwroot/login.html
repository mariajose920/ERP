<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - ERP Corporativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./config.js"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center font-sans">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">
        <div class="text-center mb-8">
            <span class="text-5xl block mb-4">🏢</span>
            <h1 class="text-2xl font-black text-slate-800">ERP Corporativo</h1>
            <p class="text-slate-500 text-sm mt-2">Inicia sesión para continuar</p>
        </div>
        <form id="loginForm" class="space-y-6">
            <div id="errorBox" class="hidden bg-rose-50 text-rose-600 p-3 rounded-lg text-sm font-bold border border-rose-200"></div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Usuario</label>
                <input type="text" id="email" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow" placeholder="Ej. ADMIN o CAJA1">
            </div>
            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">Contraseña</label>
                <input type="password" id="password" required class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-shadow" placeholder="••••••••">
            </div>
            <button type="submit" id="btnSubmit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors flex justify-center items-center">
                <span>Ingresar al Sistema</span>
            </button>
        </form>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('btnSubmit');
            const errorBox = document.getElementById('errorBox');
            
            btn.disabled = true;
            btn.innerHTML = 'Conectando...';
            errorBox.classList.add('hidden');
            
            try {
                const response = await fetch((window.ERP_CONFIG.API_BASE_URL || '/api') + '/Auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                if (!response.ok) {
                    let errMsg = 'Error en las credenciales';
                    try {
                        const err = await response.json();
                        errMsg = err.mensaje || errMsg;
                    } catch(e) {}
                    throw new Error(errMsg);
                }
                
                const data = await response.json();
                localStorage.setItem('token', data.token); // KEY EXACTA
                window.location.href = 'index_erp.html';
            } catch (error) {
                errorBox.textContent = error.message;
                errorBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Ingresar al Sistema';
            }
        });
    </script>
</body>
</html>
