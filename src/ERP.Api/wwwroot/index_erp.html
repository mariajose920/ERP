<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Portal / Integración — Responsable: Cristóbal -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Portal con datos reales: GET /api/dashboard/resumen (cada bloque llega solo si el rol tiene permiso).
        const MODULOS = [
            { clave: 'Ventas', icono: '🛒', color: '#059669', suave: '#ecfdf5', responsable: 'María' },
            { clave: 'Compras', icono: '🛍️', color: '#d97706', suave: '#fffbeb', responsable: 'Adán' },
            { clave: 'Inventario', icono: '📦', color: '#0284c7', suave: '#f0f9ff', responsable: 'Adán' },
            { clave: 'Contabilidad', icono: '📊', color: '#7c3aed', suave: '#f5f3ff', responsable: 'Cristóbal' },
            { clave: 'Administración', icono: '⚙️', color: '#e11d48', suave: '#fff1f2', responsable: 'Cristóbal' }
        ];

        function TarjetaModulo({ m }) {
            const paginas = Object.keys(ErpAuth.PAGINAS).filter(p => ErpAuth.PAGINAS[p].grupo === m.clave && ErpAuth.puedeVer(p));
            if (paginas.length === 0) return null;
            return (
                <section className="erp-card overflow-hidden" style={{ borderTop: `4px solid ${m.color}` }}>
                    <div className="p-4 flex items-center gap-3" style={{ background: m.suave }}>
                        <span className="text-2xl" aria-hidden="true">{m.icono}</span>
                        <div><h2 className="font-extrabold">{m.clave}</h2><div className="text-xs text-slate-500">Responsable: {m.responsable}</div></div>
                    </div>
                    <ul className="p-2">
                        {paginas.map(p => (
                            <li key={p}><a href={p} className="flex items-center gap-2 px-3 py-2 rounded-lg text-sm font-semibold hover:bg-slate-100">
                                <span aria-hidden="true">{ErpAuth.PAGINAS[p].icono}</span>{ErpAuth.PAGINAS[p].titulo}</a></li>
                        ))}
                    </ul>
                </section>
            );
        }

        function Portal() {
            const { datos, cargando, recargar } = useApi('/api/dashboard/resumen', null);
            const u = ErpAuth.usuarioActual() || {};
            const v = datos?.ventas, c = datos?.compras, i = datos?.inventario, k = datos?.contabilidad;

            return (
                <Pagina icono="🏠" titulo={`Bienvenido, ${u.nombreCompleto || ''}`} subtitulo={`Perfil ${u.rol || ''} · ${formatFecha(new Date())}`}
                    acciones={<Boton variante="secundario" onClick={recargar}>🔄 Actualizar</Boton>}>
                    <Kpis>
                        {(cargando || v) && <Kpi icono="🛒" titulo="Ventas de hoy" valor={formatCLP(v?.ventasHoy)} detalle={`Mes: ${formatCLP(v?.ventasMes)}`} tono="verde" cargando={cargando} />}
                        {(cargando || v) && <Kpi icono="⏳" titulo="Cuentas por cobrar" valor={formatCLP(v?.cuentasPorCobrar)} detalle={`${v?.documentosVencidos ?? 0} documentos vencidos`} tono="rojo" cargando={cargando} />}
                        {(cargando || c) && <Kpi icono="📋" titulo="OC abiertas" valor={c?.ordenesAbiertas ?? '—'} detalle={`Compras del mes: ${formatCLP(c?.comprasMes)}`} tono="amarillo" cargando={cargando} />}
                        {(cargando || i) && <Kpi icono="📦" titulo="Valor inventario" valor={formatCLP(i?.valorInventario)} detalle={`${i?.alertasReorden ?? 0} productos a reponer`} tono="azul" cargando={cargando} />}
                        {(cargando || k) && <Kpi icono="📊" titulo="Caja + Banco" valor={formatCLP((k?.caja || 0) + (k?.banco || 0))} detalle={`${k?.asientosMes ?? 0} asientos este mes`} tono="violeta" cargando={cargando} />}
                        {k && k.asientosDescuadrados > 0 && <Kpi icono="⚠️" titulo="Asientos descuadrados" valor={k.asientosDescuadrados} tono="rojo" />}
                    </Kpis>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
                        {v && (
                            <Card sinPadding titulo="Últimas ventas" acciones={ErpAuth.puedeVer('pantalla_historial_directas.html') && <a className="btn btn-secundario btn-chico" href="pantalla_historial_directas.html">Ver todas</a>}>
                                <Tabla filas={v.ultimasVentas} vacio={<Vacio icono="🛒" titulo="Sin ventas registradas" />} columnas={[
                                    { titulo: 'Documento', render: x => <span className="font-mono font-semibold">{x.numeroFactura}</span> },
                                    { titulo: 'Cliente', campo: 'cliente' },
                                    { titulo: 'Estado', render: x => <BadgeEstadoVenta estado={x.estado} /> },
                                    { titulo: 'Total', num: true, render: x => formatCLP(x.total) }
                                ]} />
                            </Card>
                        )}
                        {i && (
                            <Card sinPadding titulo="Productos críticos" acciones={<a className="btn btn-secundario btn-chico" href="pantalla_ajustes_alertas_inventario.html">Alertas</a>}>
                                <Tabla filas={i.productosCriticos} vacio={<Vacio icono="✅" titulo="Sin productos bajo reorden" />} columnas={[
                                    { titulo: 'Producto', render: x => <div><div className="font-semibold">{x.nombre}</div><div className="text-xs font-mono text-slate-500">{x.sku}</div></div> },
                                    { titulo: 'Stock', num: true, render: x => formatNumero(x.stockActual) },
                                    { titulo: 'Reorden', num: true, render: x => formatNumero(x.puntoReorden) },
                                    { titulo: '', render: x => <BadgeStock stock={x.stockActual} puntoReorden={x.puntoReorden} /> }
                                ]} />
                            </Card>
                        )}
                    </div>

                    <h2 className="text-lg font-extrabold mb-3">Módulos</h2>
                    <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-5 gap-4">
                        {MODULOS.map(m => <TarjetaModulo key={m.clave} m={m} />)}
                    </div>
                </Pagina>
            );
        }

        montar(Portal);
    </script>
</body>
</html>
