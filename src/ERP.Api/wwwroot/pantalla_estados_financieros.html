<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Contabilidad — Responsable: Cristóbal -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estados financieros - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Estados financieros imprimibles (@media print en shared/erp-ui.css):
        // GET /api/contabilidad/estado-resultados?desde&hasta y GET /api/contabilidad/balance-general.
        const { useState } = React;

        function Linea({ texto, valor, fuerte, sangria, negativo }) {
            return (
                <div className={`flex justify-between py-1.5 border-b border-slate-100 ${fuerte ? 'font-extrabold text-base border-slate-300' : 'text-sm'}`} style={{ paddingLeft: sangria ? '1.25rem' : 0 }}>
                    <span>{texto}</span><span className={`tabular-nums ${valor < 0 || negativo ? 'text-rose-700' : ''}`}>{negativo && valor > 0 ? `(${formatCLP(valor)})` : formatCLP(valor)}</span>
                </div>
            );
        }

        function EstadosFinancieros() {
            const hoy = new Date();
            const [tab, setTab] = useState('resultados');
            const [desde, setDesde] = useState(fechaISO(new Date(hoy.getFullYear(), 0, 1)));
            const [hasta, setHasta] = useState(fechaISO(hoy));
            const er = useApi(`/api/contabilidad/estado-resultados?desde=${desde}&hasta=${hasta}T23:59:59`, null);
            const bg = useApi('/api/contabilidad/balance-general', null);
            const r = er.datos, b = bg.datos;
            const grupo = (tipo) => (b?.lineas || []).filter(l => l.tipo === tipo);

            return (
                <Pagina subtitulo="Estado de resultados y balance general, listos para imprimir o guardar en PDF."
                    acciones={<Boton onClick={() => window.print()}>🖨️ Imprimir / PDF</Boton>}>
                    <Tabs tabs={[{ id: 'resultados', texto: '📈 Estado de resultados' }, { id: 'balance', texto: '🏦 Balance general' }]} activa={tab} onCambiar={setTab} />

                    <div className="solo-impresion mb-4">
                        <h1 className="text-2xl font-extrabold">ERP Corporativo</h1>
                        <p>{tab === 'resultados' ? `Estado de resultados del ${formatFecha(desde + 'T00:00')} al ${formatFecha(hasta + 'T00:00')}` : `Balance general al ${formatFecha(new Date())}`} · Cifras en pesos chilenos (CLP)</p>
                    </div>

                    {tab === 'resultados' && <>
                        <Card className="mb-6 no-print">
                            <div className="flex flex-wrap gap-4">
                                <Campo etiqueta="Desde" id="ef-desde"><input id="ef-desde" type="date" className="erp-input" value={desde} onChange={e => setDesde(e.target.value)} /></Campo>
                                <Campo etiqueta="Hasta" id="ef-hasta"><input id="ef-hasta" type="date" className="erp-input" value={hasta} onChange={e => setHasta(e.target.value)} /></Campo>
                            </div>
                        </Card>
                        <Kpis>
                            <Kpi icono="📈" titulo="Ingresos" valor={formatCLP(r?.ingresosPorVentas)} tono="verde" cargando={er.cargando} />
                            <Kpi icono="🧮" titulo="Margen bruto" valor={formatCLP(r?.margenBruto)} detalle={r?.ingresosPorVentas ? `${Math.round(r.margenBruto / r.ingresosPorVentas * 100)}% de los ingresos` : ''} tono="azul" cargando={er.cargando} />
                            <Kpi icono={r?.utilidadNeta >= 0 ? '✅' : '🔻'} titulo="Resultado neto" valor={formatCLP(r?.utilidadNeta)} tono={r?.utilidadNeta >= 0 ? 'verde' : 'rojo'} cargando={er.cargando} />
                        </Kpis>
                        <Card titulo="Estado de resultados" className="max-w-3xl">
                            {er.cargando || !r ? <Cargando /> : <>
                                <Linea texto="Ingresos por ventas" valor={r.ingresosPorVentas} />
                                <Linea texto="Costo de ventas" valor={r.costoDeVentas} sangria negativo />
                                <Linea texto="MARGEN BRUTO" valor={r.margenBruto} fuerte />
                                <Linea texto="Gastos operacionales y mermas" valor={r.gastosOperacionales} sangria negativo />
                                <Linea texto={r.utilidadNeta >= 0 ? 'UTILIDAD DEL EJERCICIO' : 'PÉRDIDA DEL EJERCICIO'} valor={r.utilidadNeta} fuerte />
                            </>}
                        </Card>
                    </>}

                    {tab === 'balance' && <>
                        <Kpis>
                            <Kpi icono="🏦" titulo="Activos" valor={formatCLP(b?.totalActivos)} tono="azul" cargando={bg.cargando} />
                            <Kpi icono="📕" titulo="Pasivos" valor={formatCLP(b?.totalPasivos)} tono="amarillo" cargando={bg.cargando} />
                            <Kpi icono="🏛️" titulo="Patrimonio + resultado" valor={formatCLP((b?.totalPatrimonio || 0) + (b?.resultadoEjercicio || 0))} tono="violeta" cargando={bg.cargando} />
                            <Kpi icono={b?.cuadra ? '⚖️' : '⚠️'} titulo="Ecuación contable" valor={b ? (b.cuadra ? 'Cuadra' : 'No cuadra') : '—'} tono={b?.cuadra ? 'verde' : 'rojo'} cargando={bg.cargando} />
                        </Kpis>
                        {bg.cargando || !b ? <Card><Cargando /></Card> : (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                <Card titulo="Activo">
                                    {grupo('Activo').length === 0 ? <Vacio titulo="Sin saldos" /> : grupo('Activo').map(l => <Linea key={l.codigo} texto={`${l.codigo} ${l.nombre}`} valor={l.saldo} sangria />)}
                                    <Linea texto="TOTAL ACTIVO" valor={b.totalActivos} fuerte />
                                </Card>
                                <Card titulo="Pasivo y patrimonio">
                                    {grupo('Pasivo').map(l => <Linea key={l.codigo} texto={`${l.codigo} ${l.nombre}`} valor={l.saldo} sangria />)}
                                    <Linea texto="Total pasivo" valor={b.totalPasivos} fuerte />
                                    {grupo('Patrimonio').map(l => <Linea key={l.codigo} texto={`${l.codigo} ${l.nombre}`} valor={l.saldo} sangria />)}
                                    <Linea texto="Resultado del ejercicio" valor={b.resultadoEjercicio} sangria />
                                    <Linea texto="TOTAL PASIVO + PATRIMONIO" valor={b.totalPasivos + b.totalPatrimonio + b.resultadoEjercicio} fuerte />
                                </Card>
                            </div>
                        )}
                    </>}
                </Pagina>
            );
        }

        montar(EstadosFinancieros);
    </script>
</body>
</html>
