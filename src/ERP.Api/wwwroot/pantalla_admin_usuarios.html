<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Seguridad — Responsable: Cristóbal -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios y roles - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Administración RBAC: GET/PUT /api/usuarios, POST /api/auth/register, GET /api/roles, GET /api/permisos,
        // PUT /api/roles/{id}/permisos y auditoría GET /api/integracion/auditoria.
        const { useState, useMemo } = React;
        const TONO_ROL = { Administrador: 'rojo', Cajero: 'verde', Vendedor: 'verde', Comprador: 'amarillo', Bodeguero: 'azul', Contador: 'violeta' };
        const FIJOS = ['Administrador', 'Cajero'];

        function AdminUsuarios() {
            const usuarios = useApi('/api/usuarios', []);
            const roles = useApi('/api/roles', []);
            const permisos = useApi('/api/permisos', []);
            const [tab, setTab] = useState('usuarios');
            const [busqueda, setBusqueda] = useState('');
            const [form, setForm] = useState(null);
            const [rolEditado, setRolEditado] = useState(null);
            const [guardando, setGuardando] = useState(false);
            const yo = (ErpAuth.usuarioActual() || {}).email;

            const filtrados = useMemo(() => (usuarios.datos || []).filter(u =>
                normalizar(`${u.nombreCompleto} ${u.email} ${u.rut} ${u.rol}`).includes(normalizar(busqueda))), [usuarios.datos, busqueda]);
            const modulos = useMemo(() => {
                const m = {};
                (permisos.datos || []).forEach(p => (m[p.modulo] = m[p.modulo] || []).push(p));
                return m;
            }, [permisos.datos]);

            const guardarUsuario = async (e) => {
                e.preventDefault();
                setGuardando(true);
                try {
                    if (form.id) {
                        await apiFetch(`/api/usuarios/${form.id}`, { method: 'PUT', body: { nombreCompleto: form.nombreCompleto, rut: form.rut, rolId: Number(form.rolId), activo: form.activo, nuevaPassword: form.password || null,
                            porcentajeComision: form.porcentajeComision === '' || form.porcentajeComision == null ? null : Number(form.porcentajeComision) } });
                    } else {
                        await apiFetch('/api/auth/register', { method: 'POST', body: { nombreCompleto: form.nombreCompleto, email: form.email, password: form.password, rut: form.rut, rolId: Number(form.rolId) } });
                    }
                    mostrarToast(form.id ? 'Usuario actualizado.' : 'Usuario creado.', 'exito');
                    setForm(null); usuarios.recargar(); roles.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
                finally { setGuardando(false); }
            };

            const cambiarEstado = async (u) => {
                if (!await confirmar({ titulo: u.activo ? 'Desactivar usuario' : 'Reactivar usuario', peligro: u.activo,
                    mensaje: `${u.activo ? 'Desactivar' : 'Reactivar'} a ${u.nombreCompleto} (${u.email}).${u.activo ? '\nNo podrá iniciar sesión.' : ''}` })) return;
                try {
                    await apiFetch(`/api/usuarios/${u.id}`, { method: 'PUT', body: { nombreCompleto: u.nombreCompleto, rut: u.rut, rolId: u.rolId, activo: !u.activo, nuevaPassword: null, porcentajeComision: u.porcentajeComision ?? null } });
                    usuarios.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
            };

            const guardarRol = async () => {
                try {
                    await apiFetch(`/api/roles/${rolEditado.id}/permisos`, { method: 'PUT', body: { permisos: rolEditado.permisos } });
                    mostrarToast(`Permisos de ${rolEditado.nombre} actualizados. Aplican en el próximo inicio de sesión.`, 'exito');
                    setRolEditado(null); roles.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
            };
            const alternarPermiso = (codigo) => setRolEditado({ ...rolEditado, permisos: rolEditado.permisos.includes(codigo) ? rolEditado.permisos.filter(c => c !== codigo) : [...rolEditado.permisos, codigo] });

            const lista = usuarios.datos || [];
                        return (
                <Pagina subtitulo="Gestión de usuarios y asignación de roles con sus permisos (RBAC)."
                    acciones={tab === 'usuarios' && <Boton onClick={() => setForm({ nombreCompleto: '', email: '', rut: '', rolId: (roles.datos || [])[0]?.id || '', activo: true, password: '' })}>➕ Nuevo usuario</Boton>}>
                    <Kpis>
                        <Kpi icono="👤" titulo="Usuarios" valor={lista.length} cargando={usuarios.cargando} />
                        <Kpi icono="✅" titulo="Activos" valor={lista.filter(u => u.activo).length} tono="verde" cargando={usuarios.cargando} />
                        <Kpi icono="🛡️" titulo="Roles" valor={(roles.datos || []).length} tono="violeta" cargando={roles.cargando} />
                    </Kpis>
                    <Tabs tabs={[{ id: 'usuarios', texto: '👤 Usuarios' }, { id: 'roles', texto: '🛡️ Roles y permisos' }]} activa={tab} onCambiar={setTab} />

                    {tab === 'usuarios' && (
                        <Card sinPadding titulo="Usuarios" acciones={<Buscador valor={busqueda} onCambio={setBusqueda} placeholder="Nombre, email, RUT o rol" />}>
                            <Tabla filas={filtrados} cargando={usuarios.cargando} vacio={<Vacio icono="👤" titulo="Sin usuarios" />} columnas={[
                                { titulo: 'Usuario', render: u => <div className="flex items-center gap-2"><span className="erp-nav-avatar text-white text-sm">{u.nombreCompleto.charAt(0)}</span>
                                    <div><div className="font-semibold">{u.nombreCompleto}</div><div className="text-xs text-slate-500">{u.email}</div></div></div> },
                                { titulo: 'RUT', render: u => <span className="font-mono text-xs">{u.rut}</span> },
                                { titulo: 'Rol', render: u => <Badge tono={TONO_ROL[u.rol] || 'gris'}>{u.rol}</Badge> },
                                { titulo: 'Comisión', num: true, render: u => u.porcentajeComision != null ? `${u.porcentajeComision}%` : <span className="text-slate-400" title="Sin valor propio: se usa el 2% por defecto">2% (defecto)</span> },
                                { titulo: 'Estado', render: u => u.activo ? <Badge tono="verde">Activo</Badge> : <Badge tono="gris">Inactivo</Badge> },
                                { titulo: 'Último acceso', render: u => u.ultimoAcceso ? formatFecha(u.ultimoAcceso, true) : <span className="text-slate-400">Nunca</span> },
                                { titulo: '', render: u => <div className="flex gap-1">
                                    <button className="btn btn-secundario btn-chico" onClick={() => setForm({ ...u, password: '', porcentajeComision: u.porcentajeComision ?? '' })} aria-label={`Editar ${u.nombreCompleto}`}>✏️</button>
                                    {u.email !== yo && <button className="btn btn-secundario btn-chico" onClick={() => cambiarEstado(u)}>{u.activo ? 'Desactivar' : 'Reactivar'}</button>}
                                </div> }
                            ]} />
                        </Card>
                    )}

                    {tab === 'roles' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
                            {roles.cargando ? <Card><Cargando /></Card> : (roles.datos || []).map(r => (
                                <Card key={r.id} titulo={<span className="flex items-center gap-2"><Badge tono={TONO_ROL[r.nombre] || 'gris'}>{r.nombre}</Badge><span className="text-xs text-slate-500">{r.cantidadUsuarios} usuarios</span></span>}
                                    acciones={FIJOS.includes(r.nombre) ? <Badge tono="gris">🔒 Fijo</Badge> : <button className="btn btn-secundario btn-chico" onClick={() => setRolEditado({ ...r, permisos: [...r.permisos] })}>Editar permisos</button>}>
                                    <p className="text-xs text-slate-500 mb-2">{r.descripcion}</p>
                                    <div className="flex flex-wrap gap-1">
                                        {r.nombre === 'Administrador' ? <Badge tono="rojo">Todos los permisos</Badge> : r.permisos.map(p => <Badge key={p} tono="gris">{p}</Badge>)}
                                    </div>
                                </Card>
                            ))}
                        </div>
                    )}

                    <Modal abierto={!!form} titulo={form?.id ? 'Editar usuario' : 'Nuevo usuario'} onCerrar={() => setForm(null)}
                        pie={<><button className="btn btn-secundario" onClick={() => setForm(null)}>Cancelar</button><Boton type="submit" form="form-usuario" cargando={guardando}>Guardar</Boton></>}>
                        {form && (
                            <form id="form-usuario" onSubmit={guardarUsuario} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Campo etiqueta="Nombre completo *" id="u-nom"><input id="u-nom" className="erp-input" value={form.nombreCompleto} onChange={e => setForm({ ...form, nombreCompleto: e.target.value })} required /></Campo>
                                <Campo etiqueta="Email / usuario *" id="u-mail" ayuda={form.id ? 'El usuario de acceso no se modifica.' : ''}><input id="u-mail" className="erp-input" value={form.email} disabled={!!form.id} onChange={e => setForm({ ...form, email: e.target.value })} required /></Campo>
                                <Campo etiqueta="RUT *" id="u-rut"><input id="u-rut" className="erp-input font-mono" value={form.rut} onChange={e => setForm({ ...form, rut: e.target.value })} required /></Campo>
                                <Campo etiqueta="Rol *" id="u-rol">
                                    <select id="u-rol" className="erp-input" value={form.rolId} onChange={e => setForm({ ...form, rolId: e.target.value })}>
                                        {(roles.datos || []).map(r => <option key={r.id} value={r.id}>{r.nombre}</option>)}
                                    </select>
                                </Campo>
                                <Campo etiqueta={form.id ? 'Nueva contraseña (opcional)' : 'Contraseña *'} id="u-pass" ayuda="Mínimo 8 caracteres.">
                                    <input id="u-pass" type="password" autoComplete="new-password" minLength="8" className="erp-input" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })} required={!form.id} />
                                </Campo>
{form.id && <Campo etiqueta="Comisión de ventas (%)" id="u-comision" ayuda="Sobre el neto vendido. Vacío = 2% por defecto."><input id="u-comision" type="number" min="0" max="100" step="0.01" className="erp-input" value={form.porcentajeComision ?? ''} onChange={e => setForm({ ...form, porcentajeComision: e.target.value })} /></Campo>}
                                {form.id && <label className="flex items-center gap-2 text-sm font-semibold self-end pb-2"><input type="checkbox" checked={form.activo} disabled={form.email === yo} onChange={e => setForm({ ...form, activo: e.target.checked })} /> Activo</label>}
                            </form>
                        )}
                    </Modal>

                    <Modal abierto={!!rolEditado} ancho titulo={rolEditado ? `Permisos del rol ${rolEditado.nombre}` : ''} onCerrar={() => setRolEditado(null)}
                        pie={<><button className="btn btn-secundario" onClick={() => setRolEditado(null)}>Cancelar</button><button className="btn btn-primario" onClick={guardarRol}>Guardar permisos</button></>}>
                        {rolEditado && (
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                {Object.keys(modulos).map(m => (
                                    <fieldset key={m} className="border rounded-lg p-3">
                                        <legend className="px-1 text-xs font-extrabold uppercase tracking-wide">{m}</legend>
                                        {modulos[m].map(p => (
                                            <label key={p.codigo} className="flex items-start gap-2 text-sm py-1">
                                                <input type="checkbox" className="mt-1" checked={rolEditado.permisos.includes(p.codigo)} onChange={() => alternarPermiso(p.codigo)} />
                                                <span><span className="block">{p.descripcion}</span><span className="font-mono text-[11px] text-slate-500">{p.codigo}</span></span>
                                            </label>
                                        ))}
                                    </fieldset>
                                ))}
                            </div>
                        )}
                    </Modal>
                </Pagina>
            );
        }

        montar(AdminUsuarios);
    </script>
</body>
</html>
