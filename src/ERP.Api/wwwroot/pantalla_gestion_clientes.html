<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Ventas — Responsable: María -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Maestro de clientes: /api/clientes (M8). El Cajero puede consultar y crear clientes básicos
        // (sin límite de crédito); editar, asignar crédito y dar de baja requiere ventas.clientes.escribir.
        const { useState, useMemo } = React;
        const VACIO = { rut: '', razonSocial: '', contacto: '', telefono: '', email: '', direccion: '', limiteCredito: 0 };

        /** Uso de la línea de crédito: verde < 70 %, amarillo < 100 %, rojo si la supera. */
        function UsoCredito({ c }) {
            if (!c.limiteCredito) return c.saldoPendiente > 0 ? <Badge tono="rojo">Deuda sin crédito</Badge> : <span className="text-xs text-slate-400">Sin crédito</span>;
            const pct = Math.round(c.saldoPendiente / c.limiteCredito * 100);
            return <div className="w-32"><Progreso valor={c.saldoPendiente} maximo={c.limiteCredito} etiqueta={`${pct}% usado`} /></div>;
        }

        function GestionClientes() {
            const { datos, cargando, recargar } = useApi('/api/clientes?incluirInactivos=true', []);
            const [busqueda, setBusqueda] = useState('');
            const [soloDeuda, setSoloDeuda] = useState(false);
            const [form, setForm] = useState(null);
            const [editandoId, setEditandoId] = useState(null);
            const [guardando, setGuardando] = useState(false);
            const puedeCrear = ErpAuth.tienePermiso('ventas.clientes.crear');
            const puedeEscribir = ErpAuth.tienePermiso('ventas.clientes.escribir');

            const lista = datos || [];
            const activos = lista.filter(c => c.activo);
            // Los filtros fijos van primero; la búsqueda ordena por similitud (nombre > RUT > email, contacto, teléfono).
            const filtrados = useMemo(() => buscarSimilares(
                lista.filter(c => (puedeEscribir || c.activo) && (!soloDeuda || c.saldoPendiente > 0)),
                busqueda, c => [c.razonSocial, c.rut, c.email || '', c.contacto || '', c.telefono || '']
            ), [lista, busqueda, soloDeuda]);

            const abrir = (c) => {
                setEditandoId(c ? c.id : null);
                setForm(c ? { ...VACIO, ...c, contacto: c.contacto || '', telefono: c.telefono || '', direccion: c.direccion || '' } : { ...VACIO });
            };
            const cambiar = (k) => (e) => setForm({ ...form, [k]: e.target.value });

            const guardar = async (e) => {
                e.preventDefault();
                if (!validarRut(form.rut)) { mostrarToast('RUT inválido: revise el dígito verificador.', 'error'); return; }
                setGuardando(true);
                try {
                    const cuerpo = { rut: formatearRut(form.rut), razonSocial: form.razonSocial.trim().toUpperCase(), contacto: form.contacto || null,
                        direccion: form.direccion || null, telefono: form.telefono || null, email: form.email.trim(), limiteCredito: puedeEscribir ? Number(form.limiteCredito) : 0 };
                    if (editandoId) await apiFetch(`/api/clientes/${editandoId}`, { method: 'PUT', body: cuerpo });
                    else await apiFetch('/api/clientes', { method: 'POST', body: cuerpo });
                    mostrarToast(editandoId ? 'Cliente actualizado.' : 'Cliente creado.', 'exito');
                    setForm(null);
                    recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
                finally { setGuardando(false); }
            };

            const darDeBaja = async (c) => {
                if (!await confirmar({ titulo: 'Dar de baja cliente', peligro: true, textoConfirmar: 'Dar de baja',
                    mensaje: `¿Dar de baja a ${c.razonSocial}? Solo es posible si no tiene deuda pendiente.` })) return;
                try {
                    await apiFetch(`/api/clientes/${c.id}`, { method: 'DELETE' });
                    mostrarToast('Cliente dado de baja.', 'exito');
                    recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
            };

            return (
                <Pagina subtitulo="Directorio de clientes, línea de crédito y deuda vigente."
                    acciones={puedeCrear && <Boton onClick={() => abrir(null)}>➕ Nuevo cliente</Boton>}>
                    <Kpis>
                        <Kpi icono="👥" titulo="Clientes activos" valor={activos.length} cargando={cargando} />
                        <Kpi icono="💳" titulo="Con crédito" valor={activos.filter(c => c.limiteCredito > 0).length} tono="azul" cargando={cargando} />
                        <Kpi icono="⏳" titulo="Con deuda" valor={activos.filter(c => c.saldoPendiente > 0).length} tono="amarillo" cargando={cargando} />
                        <Kpi icono="💰" titulo="Deuda total" valor={formatCLP(activos.reduce((s, c) => s + c.saldoPendiente, 0))} tono="rojo" cargando={cargando} />
                    </Kpis>
                    <Card sinPadding titulo="Clientes" acciones={<>
                        <Buscador valor={busqueda} onCambio={setBusqueda} placeholder="RUT, nombre, email o contacto" />
                        <label className="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" checked={soloDeuda} onChange={e => setSoloDeuda(e.target.checked)} /> Solo con deuda</label>
                    </>}>
                        <Tabla filas={filtrados} cargando={cargando} vacio={<Vacio icono="👥" titulo="Sin clientes que coincidan" />} columnas={[
                            { titulo: 'RUT', render: c => <span className="font-mono text-xs">{c.rut}</span> },
                            { titulo: 'Cliente', render: c => <div className="font-semibold">{c.razonSocial}</div> },
                            { titulo: 'Contacto', render: c => <div className="text-xs"><div>{c.email}</div><div className="text-slate-500">{c.telefono}</div></div> },
                            { titulo: 'Límite', num: true, render: c => formatCLP(c.limiteCredito) },
                            { titulo: 'Deuda', num: true, render: c => <strong className={c.saldoPendiente > 0 ? 'text-rose-700' : ''}>{formatCLP(c.saldoPendiente)}</strong> },
                            { titulo: 'Uso crédito', render: c => <UsoCredito c={c} /> },
                            { titulo: 'Estado', render: c => c.activo ? <Badge tono="verde">Activo</Badge> : <Badge tono="gris">Inactivo</Badge> },
                            ...(puedeEscribir ? [{ titulo: '', render: c => <div className="flex gap-1">
                                <button className="btn btn-secundario btn-chico" onClick={() => abrir(c)} aria-label={`Editar ${c.razonSocial}`}>✏️</button>
                                {c.activo && <button className="btn btn-secundario btn-chico" onClick={() => darDeBaja(c)} aria-label={`Dar de baja ${c.razonSocial}`}>🚫</button>}
                            </div> }] : [])
                        ]} />
                    </Card>

                    <Modal abierto={!!form} titulo={editandoId ? 'Editar cliente' : 'Nuevo cliente'} onCerrar={() => setForm(null)}
                        pie={<><button className="btn btn-secundario" onClick={() => setForm(null)}>Cancelar</button><Boton type="submit" form="form-cliente" cargando={guardando}>Guardar</Boton></>}>
                        {form && (
                            <form id="form-cliente" onSubmit={guardar} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Campo etiqueta="RUT *" id="c-rut" error={form.rut.length >= 8 && !validarRut(form.rut) ? 'RUT inválido' : null}><input id="c-rut" className="erp-input font-mono" value={form.rut} onChange={cambiar('rut')} required /></Campo>
                                <Campo etiqueta="Razón social / nombre *" id="c-razon"><input id="c-razon" className="erp-input" value={form.razonSocial} onChange={cambiar('razonSocial')} required /></Campo>
                                <Campo etiqueta="Email *" id="c-email"><input id="c-email" type="email" className="erp-input" value={form.email} onChange={cambiar('email')} required /></Campo>
                                <Campo etiqueta="Teléfono" id="c-tel"><input id="c-tel" className="erp-input" value={form.telefono} onChange={cambiar('telefono')} /></Campo>
                                <Campo etiqueta="Contacto" id="c-cont"><input id="c-cont" className="erp-input" value={form.contacto} onChange={cambiar('contacto')} /></Campo>
                                <Campo etiqueta="Dirección" id="c-dir" className="sm:col-span-2"><input id="c-dir" className="erp-input" value={form.direccion} onChange={cambiar('direccion')} /></Campo>
                                {puedeEscribir && <Campo etiqueta="Límite de crédito (CLP)" id="c-lim" ayuda="0 = solo ventas al contado."><input id="c-lim" type="number" min="0" className="erp-input" value={form.limiteCredito} onChange={e => setForm({ ...form, limiteCredito: e.target.value.replace(/^0+(?=\d)/, '') })} /></Campo>}
                            </form>
                        )}
                    </Modal>
                </Pagina>
            );
        }

        montar(GestionClientes);
    </script>
</body>
</html>
