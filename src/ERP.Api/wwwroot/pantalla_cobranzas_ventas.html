<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Ventas — Responsable: María -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuentas por cobrar - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Cartera de cuentas por cobrar con antigüedad de deuda: GET /api/reportes/cuentas-por-cobrar.
        const { useState, useMemo } = React;
        const TRAMOS = [
            { id: 'aldia', texto: 'Al día', prueba: d => d <= 0, tono: 'verde' },
            { id: '1-30', texto: '1 a 30 días', prueba: d => d > 0 && d <= 30, tono: 'amarillo' },
            { id: '31-60', texto: '31 a 60 días', prueba: d => d > 30 && d <= 60, tono: 'rojo' },
            { id: '60+', texto: 'Más de 60 días', prueba: d => d > 60, tono: 'rojo' }
        ];

        function CuentasPorCobrar() {
            const cxc = useApi('/api/reportes/cuentas-por-cobrar', []);
            const [busqueda, setBusqueda] = useState('');
            const [tramo, setTramo] = useState('');
            const lista = cxc.datos || [];
            const filtradas = useMemo(() => lista.filter(v =>
                (!tramo || TRAMOS.find(t => t.id === tramo).prueba(v.diasMora)) &&
                normalizar(`${v.numeroFactura} ${v.cliente} ${v.clienteRut}`).includes(normalizar(busqueda))
            ).sort((a, b) => b.diasMora - a.diasMora), [lista, busqueda, tramo]);
            const total = lista.reduce((s, v) => s + v.saldoPendiente, 0);

            return (
                <Pagina subtitulo="Antigüedad de la deuda de clientes con semáforo de mora."
                    acciones={<>
                        {ErpAuth.puedeVer('pantalla_cobranzas_plazo.html') && <a className="btn btn-primario" href="pantalla_cobranzas_plazo.html">💸 Registrar abonos</a>}
                        <Boton variante="secundario" onClick={() => descargarCSV('cuentas_por_cobrar.csv', filtradas, [
                            { titulo: 'Documento', valor: v => v.numeroFactura }, { titulo: 'Cliente', valor: v => v.cliente }, { titulo: 'RUT', valor: v => v.clienteRut },
                            { titulo: 'Vencimiento', valor: v => formatFecha(v.fechaVencimiento) }, { titulo: 'Días mora', valor: v => v.diasMora }, { titulo: 'Saldo', valor: v => v.saldoPendiente }])}>⬇️ CSV</Boton>
                    </>}>
                    <Kpis>
                        {TRAMOS.map(t => {
                            const monto = lista.filter(v => t.prueba(v.diasMora)).reduce((s, v) => s + v.saldoPendiente, 0);
                            return <Kpi key={t.id} icono={t.tono === 'verde' ? '🟢' : t.tono === 'amarillo' ? '🟡' : '🔴'} titulo={t.texto} valor={formatCLP(monto)}
                                detalle={total ? `${Math.round(monto / total * 100)}% de la cartera` : ''} tono={t.tono} cargando={cxc.cargando} />;
                        })}
                    </Kpis>
                    <Card sinPadding titulo={`Cartera vigente · ${formatCLP(total)}`} acciones={<>
                        <Buscador valor={busqueda} onCambio={setBusqueda} placeholder="Documento, cliente o RUT" />
                        <label className="sr-only" htmlFor="cxc-tramo">Tramo</label>
                        <select id="cxc-tramo" className="erp-input w-auto" value={tramo} onChange={e => setTramo(e.target.value)}>
                            <option value="">Todos los tramos</option>{TRAMOS.map(t => <option key={t.id} value={t.id}>{t.texto}</option>)}
                        </select>
                    </>}>
                        <Tabla filas={filtradas} cargando={cxc.cargando} vacio={<Vacio icono="🎉" titulo="No hay cuentas por cobrar" />} columnas={[
                            { titulo: 'Documento', render: v => <span className="font-mono font-semibold">{v.numeroFactura}</span> },
                            { titulo: 'Cliente', render: v => <div><div className="font-semibold">{v.cliente}</div><div className="text-xs font-mono text-slate-500">{v.clienteRut}</div></div> },
                            { titulo: 'Emisión', render: v => formatFecha(v.fechaEmision) },
                            { titulo: 'Vencimiento', render: v => formatFecha(v.fechaVencimiento) || '—' },
                            { titulo: 'Semáforo', render: v => <SemaforoMora dias={v.diasMora} /> },
                            { titulo: 'Pagado', render: v => <div className="w-28"><Progreso valor={v.totalPagado} maximo={v.total} /></div> },
                            { titulo: 'Total', num: true, render: v => formatCLP(v.total) },
                            { titulo: 'Saldo', num: true, render: v => <strong>{formatCLP(v.saldoPendiente)}</strong> }
                        ]} pie={filtradas.length > 0 && <tr><td colSpan="7" className="num">Saldo filtrado</td><td className="num">{formatCLP(filtradas.reduce((s, v) => s + v.saldoPendiente, 0))}</td></tr>} />
                    </Card>
                </Pagina>
            );
        }

        montar(CuentasPorCobrar);
    </script>
</body>
</html>
