<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Compras — Responsable: Adán -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proveedores - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Maestro de proveedores conectado a /api/proveedores (A2/A8).
        const { useState, useMemo } = React;

        const VACIO = { rut: '', razonSocial: '', giro: '', contacto: '', telefono: '', email: '', direccion: '', condicionesPago: '30 días' };
        const CONDICIONES = ['Contado', '30 días', '60 días', '90 días'];

        function GestionProveedores() {
            const { datos, cargando, recargar } = useApi('/api/proveedores?incluirInactivos=true', []);
            const [busqueda, setBusqueda] = useState('');
            const [filtroEstado, setFiltroEstado] = useState('activos');
            const [form, setForm] = useState(null);       // null = modal cerrado
            const [editandoId, setEditandoId] = useState(null);
            const [guardando, setGuardando] = useState(false);
            const puedeEscribir = ErpAuth.tienePermiso('compras.proveedores.escribir');

            const lista = datos || [];
            const filtrados = useMemo(() => lista.filter(p =>
                (filtroEstado === 'todos' || (filtroEstado === 'activos') === p.activo) &&
                normalizar(`${p.rut} ${p.razonSocial} ${p.giro} ${p.email}`).includes(normalizar(busqueda))
            ), [lista, busqueda, filtroEstado]);

            const abrir = (p) => {
                setEditandoId(p ? p.id : null);
                setForm(p ? { ...VACIO, ...p, giro: p.giro || '', contacto: p.contacto || '', telefono: p.telefono || '', direccion: p.direccion || '' } : { ...VACIO });
            };
            const cambiar = (campo) => (e) => setForm({ ...form, [campo]: e.target.value });
            const rutInvalido = form && form.rut.length >= 8 && !validarRut(form.rut);

            const guardar = async (e) => {
                e.preventDefault();
                if (!validarRut(form.rut)) { mostrarToast('RUT inválido: revise el dígito verificador.', 'error'); return; }
                setGuardando(true);
                try {
                    const cuerpo = {
                        rut: formatearRut(form.rut), razonSocial: form.razonSocial.trim().toUpperCase(), giro: form.giro || null,
                        contacto: form.contacto || null, direccion: form.direccion || null, telefono: form.telefono || null,
                        email: form.email.trim(), condicionesPago: form.condicionesPago
                    };
                    if (editandoId) await apiFetch(`/api/proveedores/${editandoId}`, { method: 'PUT', body: cuerpo });
                    else await apiFetch('/api/proveedores', { method: 'POST', body: cuerpo });
                    mostrarToast(editandoId ? 'Proveedor actualizado correctamente.' : 'Proveedor registrado correctamente.', 'exito');
                    setForm(null);
                    recargar();
                } catch (err) {
                    mostrarToast(err.message, 'error');
                } finally {
                    setGuardando(false);
                }
            };

            const desactivar = async (p) => {
                const ok = await confirmar({
                    titulo: 'Desactivar proveedor', peligro: true, textoConfirmar: 'Desactivar',
                    mensaje: `¿Desactivar a ${p.razonSocial}?\nNo podrá usarse en nuevas órdenes de compra (no se borra su historial).`
                });
                if (!ok) return;
                try {
                    await apiFetch(`/api/proveedores/${p.id}`, { method: 'DELETE' });
                    mostrarToast('Proveedor desactivado.', 'exito');
                    recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
            };

            const columnas = [
                { titulo: 'RUT', render: p => <span className="font-mono text-xs">{p.rut}</span> },
                { titulo: 'Razón social', render: p => <div><div className="font-semibold">{p.razonSocial}</div><div className="text-xs text-slate-500">{p.giro}</div></div> },
                { titulo: 'Contacto', render: p => <div className="text-xs"><div>{p.email}</div><div className="text-slate-500">{p.telefono}</div></div> },
                { titulo: 'Condición de pago', render: p => <Badge tono="modulo">{p.condicionesPago}</Badge> },
                { titulo: 'Estado', render: p => p.activo ? <Badge tono="verde">Activo</Badge> : <Badge tono="gris">Inactivo</Badge> },
                ...(puedeEscribir ? [{
                    titulo: 'Acciones', render: p => (
                        <div className="flex gap-1">
                            <button className="btn btn-secundario btn-chico" onClick={() => abrir(p)} aria-label={`Editar ${p.razonSocial}`}>✏️ Editar</button>
                            {p.activo && <button className="btn btn-secundario btn-chico" onClick={() => desactivar(p)} aria-label={`Desactivar ${p.razonSocial}`}>🚫</button>}
                        </div>
                    )
                }] : [])
            ];

            return (
                <Pagina subtitulo="Directorio de proveedores, condiciones de pago y estado."
                    acciones={puedeEscribir && <Boton onClick={() => abrir(null)}>➕ Nuevo proveedor</Boton>}>
                    <Kpis>
                        <Kpi icono="🏢" titulo="Proveedores" valor={lista.length} cargando={cargando} />
                        <Kpi icono="✅" titulo="Activos" valor={lista.filter(p => p.activo).length} tono="verde" cargando={cargando} />
                        <Kpi icono="⏸️" titulo="Inactivos" valor={lista.filter(p => !p.activo).length} tono="gris" cargando={cargando} />
                        <Kpi icono="📅" titulo="Con crédito" valor={lista.filter(p => p.activo && p.condicionesPago !== 'Contado').length} detalle="Pago a plazo" tono="amarillo" cargando={cargando} />
                    </Kpis>
                    <Card sinPadding titulo="Proveedores" acciones={<>
                        <Buscador valor={busqueda} onCambio={setBusqueda} placeholder="RUT, razón social, giro o email" />
                        <label className="sr-only" htmlFor="filtro-estado">Estado</label>
                        <select id="filtro-estado" className="erp-input w-auto" value={filtroEstado} onChange={e => setFiltroEstado(e.target.value)}>
                            <option value="activos">Activos</option><option value="inactivos">Inactivos</option><option value="todos">Todos</option>
                        </select>
                    </>}>
                        <Tabla columnas={columnas} filas={filtrados} cargando={cargando}
                            vacio={<Vacio icono="🏢" titulo="No hay proveedores que coincidan" texto="Ajuste el filtro o registre un proveedor nuevo." />} />
                    </Card>

                    <Modal abierto={!!form} titulo={editandoId ? 'Editar proveedor' : 'Nuevo proveedor'} onCerrar={() => setForm(null)}
                        pie={<><button className="btn btn-secundario" onClick={() => setForm(null)}>Cancelar</button>
                            <Boton type="submit" form="form-proveedor" cargando={guardando}>Guardar</Boton></>}>
                        {form && (
                            <form id="form-proveedor" onSubmit={guardar} className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <Campo etiqueta="RUT *" id="p-rut" error={rutInvalido ? 'RUT inválido' : null} ayuda="Ej: 76123456-7">
                                    <input id="p-rut" className="erp-input font-mono" value={form.rut} onChange={cambiar('rut')} required />
                                </Campo>
                                <Campo etiqueta="Razón social *" id="p-razon">
                                    <input id="p-razon" className="erp-input" value={form.razonSocial} onChange={cambiar('razonSocial')} required />
                                </Campo>
                                <Campo etiqueta="Giro" id="p-giro" className="sm:col-span-2">
                                    <input id="p-giro" className="erp-input" value={form.giro} onChange={cambiar('giro')} />
                                </Campo>
                                <Campo etiqueta="Email *" id="p-email">
                                    <input id="p-email" type="email" className="erp-input" value={form.email} onChange={cambiar('email')} required />
                                </Campo>
                                <Campo etiqueta="Teléfono" id="p-tel">
                                    <input id="p-tel" className="erp-input" value={form.telefono} onChange={cambiar('telefono')} />
                                </Campo>
                                <Campo etiqueta="Persona de contacto" id="p-contacto">
                                    <input id="p-contacto" className="erp-input" value={form.contacto} onChange={cambiar('contacto')} />
                                </Campo>
                                <Campo etiqueta="Condición de pago" id="p-cond">
                                    <select id="p-cond" className="erp-input" value={form.condicionesPago} onChange={cambiar('condicionesPago')}>
                                        {CONDICIONES.map(c => <option key={c}>{c}</option>)}
                                    </select>
                                </Campo>
                                <Campo etiqueta="Dirección" id="p-dir" className="sm:col-span-2">
                                    <input id="p-dir" className="erp-input" value={form.direccion} onChange={cambiar('direccion')} />
                                </Campo>
                            </form>
                        )}
                    </Modal>
                </Pagina>
            );
        }

        montar(GestionProveedores);
    </script>
</body>
</html>
