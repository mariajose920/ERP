<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Ventas — Responsable: María -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobranzas y abonos - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Cobranza de ventas a crédito: GET /api/ventas/pendientes, abono a una factura (POST /api/ventas/pagos)
        // o abono en cascada (POST /api/ventas/pagos/cascada: paga primero la factura más antigua).
        const { useState, useMemo } = React;
        const METODOS = ['Efectivo', 'Transferencia', 'Tarjeta'];

        function Cobranzas() {
            const pendientes = useApi('/api/ventas/pendientes', []);
            const [busqueda, setBusqueda] = useState('');
            const [clienteId, setClienteId] = useState(null);
            const [abono, setAbono] = useState(null); // { modo: 'cascada'|'factura', venta?, monto, metodo, referencia }
            const [guardando, setGuardando] = useState(false);
            const [resultado, setResultado] = useState(null);

            // Agrupa la deuda por cliente.
            const porCliente = useMemo(() => {
                const m = {};
                (pendientes.datos || []).forEach(v => {
                    const c = m[v.clienteId] || (m[v.clienteId] = { clienteId: v.clienteId, cliente: v.cliente, rut: v.clienteRut, documentos: [], deuda: 0, maxMora: 0 });
                    c.documentos.push(v); c.deuda += v.saldoPendiente; c.maxMora = Math.max(c.maxMora, v.diasMora);
                });
                return Object.values(m).sort((a, b) => b.maxMora - a.maxMora || b.deuda - a.deuda);
            }, [pendientes.datos]);
            const filtrados = porCliente.filter(c => normalizar(`${c.rut} ${c.cliente}`).includes(normalizar(busqueda)));
            const seleccionado = porCliente.find(c => c.clienteId === clienteId);
            const lista = pendientes.datos || [];

            const registrar = async (e) => {
                e.preventDefault();
                const monto = Number(abono.monto);
                const tope = abono.modo === 'factura' ? abono.venta.saldoPendiente : seleccionado.deuda;
                if (!(monto > 0) || monto > tope) { mostrarToast(`Ingrese un monto entre $1 y ${formatCLP(tope)}.`, 'aviso'); return; }
                setGuardando(true);
                try {
                    if (abono.modo === 'factura') {
                        await apiFetch('/api/ventas/pagos', { method: 'POST', body: { ventaId: abono.venta.id, monto, metodoPago: abono.metodo, referenciaComprobante: abono.referencia || null } });
                        setResultado({ pagos: [{ numeroFactura: abono.venta.numeroFactura, montoAplicado: monto, saldoRestante: abono.venta.saldoPendiente - monto }], sobrante: 0 });
                    } else {
                        const r = await apiFetch('/api/ventas/pagos/cascada', { method: 'POST', body: { clienteId: seleccionado.clienteId, monto, metodoPago: abono.metodo, referenciaComprobante: abono.referencia || null } });
                        setResultado(r);
                    }
                    setAbono(null);
                    pendientes.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
                finally { setGuardando(false); }
            };

            return (
                <Pagina subtitulo="Cobro de ventas a crédito. El abono en cascada paga primero la factura más antigua.">
                    <Kpis>
                        <Kpi icono="💰" titulo="Por cobrar" valor={formatCLP(lista.reduce((s, v) => s + v.saldoPendiente, 0))} cargando={pendientes.cargando} />
                        <Kpi icono="🟢" titulo="Al día" valor={formatCLP(lista.filter(v => v.diasMora <= 0).reduce((s, v) => s + v.saldoPendiente, 0))} tono="verde" cargando={pendientes.cargando} />
                        <Kpi icono="🟡" titulo="Mora 1–30 días" valor={formatCLP(lista.filter(v => v.diasMora > 0 && v.diasMora <= 30).reduce((s, v) => s + v.saldoPendiente, 0))} tono="amarillo" cargando={pendientes.cargando} />
                        <Kpi icono="🔴" titulo="Mora > 30 días" valor={formatCLP(lista.filter(v => v.diasMora > 30).reduce((s, v) => s + v.saldoPendiente, 0))} tono="rojo" cargando={pendientes.cargando} />
                    </Kpis>

                    <div className="grid grid-cols-1 lg:grid-cols-5 gap-6">
                        <Card titulo="Clientes con deuda" className="lg:col-span-2" sinPadding acciones={<Buscador valor={busqueda} onCambio={setBusqueda} placeholder="Cliente o RUT" />}>
                            {pendientes.cargando ? <Cargando /> : filtrados.length === 0 ? <Vacio icono="🎉" titulo="Sin deudas pendientes" /> : (
                                <ul className="divide-y">
                                    {filtrados.map(c => (
                                        <li key={c.clienteId}>
                                            <button type="button" onClick={() => setClienteId(c.clienteId)}
                                                className={`w-full text-left p-3 flex justify-between gap-2 hover:bg-emerald-50 ${clienteId === c.clienteId ? 'mod-bg-suave' : ''}`}>
                                                <span><span className="block font-semibold">{c.cliente}</span><span className="text-xs font-mono text-slate-500">{c.rut} · {c.documentos.length} doc.</span></span>
                                                <span className="text-right"><span className="block font-bold">{formatCLP(c.deuda)}</span><SemaforoMora dias={c.maxMora} /></span>
                                            </button>
                                        </li>
                                    ))}
                                </ul>
                            )}
                        </Card>

                        <Card className="lg:col-span-3" sinPadding titulo={seleccionado ? `Documentos de ${seleccionado.cliente}` : 'Documentos pendientes'}
                            acciones={seleccionado && <Boton onClick={() => setAbono({ modo: 'cascada', monto: seleccionado.deuda, metodo: 'Efectivo', referencia: '' })}>💸 Abono en cascada</Boton>}>
                            {!seleccionado ? <Vacio icono="👈" titulo="Seleccione un cliente" texto="Verá sus facturas pendientes ordenadas de la más antigua a la más nueva." /> : (
                                <Tabla filas={seleccionado.documentos} columnas={[
                                    { titulo: 'Documento', render: v => <span className="font-mono font-semibold">{v.numeroFactura}</span> },
                                    { titulo: 'Emisión', render: v => formatFecha(v.fechaEmision) },
                                    { titulo: 'Vence', render: v => formatFecha(v.fechaVencimiento) },
                                    { titulo: 'Mora', render: v => <SemaforoMora dias={v.diasMora} /> },
                                    { titulo: 'Total', num: true, render: v => formatCLP(v.total) },
                                    { titulo: 'Saldo', num: true, render: v => <strong>{formatCLP(v.saldoPendiente)}</strong> },
                                    { titulo: '', render: v => <button className="btn btn-secundario btn-chico" onClick={() => setAbono({ modo: 'factura', venta: v, monto: v.saldoPendiente, metodo: 'Efectivo', referencia: '' })}>Abonar</button> }
                                ]} pie={<tr><td colSpan="5" className="num">Deuda total</td><td className="num">{formatCLP(seleccionado.deuda)}</td><td></td></tr>} />
                            )}
                        </Card>
                    </div>

                    <Modal abierto={!!abono} titulo={abono?.modo === 'factura' ? `Abono a ${abono.venta.numeroFactura}` : 'Abono en cascada'} onCerrar={() => setAbono(null)}
                        pie={<><button className="btn btn-secundario" onClick={() => setAbono(null)}>Cancelar</button><Boton type="submit" form="form-abono" cargando={guardando}>Registrar abono</Boton></>}>
                        {abono && (
                            <form id="form-abono" onSubmit={registrar} className="space-y-4">
                                {abono.modo === 'cascada' && <p className="text-sm text-slate-600">El monto se aplicará a las facturas de {seleccionado?.cliente} desde la más antigua hasta agotarlo.</p>}
                                <Campo etiqueta="Monto *" id="ab-monto" ayuda={`Máximo ${formatCLP(abono.modo === 'factura' ? abono.venta.saldoPendiente : seleccionado?.deuda)}`}>
                                    <input id="ab-monto" type="number" min="1" className="erp-input text-lg font-bold" value={abono.monto} onChange={e => setAbono({ ...abono, monto: e.target.value })} />
                                </Campo>
                                <div className="grid grid-cols-2 gap-4">
                                    <Campo etiqueta="Medio de pago" id="ab-metodo">
                                        <select id="ab-metodo" className="erp-input" value={abono.metodo} onChange={e => setAbono({ ...abono, metodo: e.target.value })}>{METODOS.map(m => <option key={m}>{m}</option>)}</select>
                                    </Campo>
                                    <Campo etiqueta="N° comprobante" id="ab-ref"><input id="ab-ref" className="erp-input" value={abono.referencia} onChange={e => setAbono({ ...abono, referencia: e.target.value })} /></Campo>
                                </div>
                            </form>
                        )}
                    </Modal>

                    <Modal abierto={!!resultado} imprimible titulo="Abono registrado" onCerrar={() => setResultado(null)}
                        pie={<><button className="btn btn-secundario" onClick={() => window.print()}>🖨️ Imprimir</button><button className="btn btn-primario" onClick={() => setResultado(null)}>Listo</button></>}>
                        {resultado && <Tabla filas={resultado.pagos} claveFila={p => p.numeroFactura} columnas={[
                            { titulo: 'Documento', campo: 'numeroFactura' },
                            { titulo: 'Aplicado', num: true, render: p => formatCLP(p.montoAplicado) },
                            { titulo: 'Saldo restante', num: true, render: p => p.saldoRestante <= 0 ? <Badge tono="verde">Pagada</Badge> : formatCLP(p.saldoRestante) }
                        ]} />}
                    </Modal>
                </Pagina>
            );
        }

        montar(Cobranzas);
    </script>
</body>
</html>
