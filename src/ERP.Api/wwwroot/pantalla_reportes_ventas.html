<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Ventas — Responsable: María -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes de ventas - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Reportes de ventas: /api/reportes/resumen-ventas, ventas-por-dia, ventas-por-cliente y ventas-por-producto.
        const { useState } = React;

        function ReportesVentas() {
            const [desde, setDesde] = useState(fechaISO(new Date(Date.now() - 29 * 864e5)));
            const [hasta, setHasta] = useState(fechaISO());
            const rango = `desde=${desde}&hasta=${hasta}T23:59:59`;
            const resumen = useApi('/api/reportes/resumen-ventas', null);
            const porDia = useApi(`/api/reportes/ventas-por-dia?desde=${desde}&hasta=${fechaISO(new Date(new Date(hasta + 'T00:00:00').getTime() + 864e5))}`, []);
            const porCliente = useApi(`/api/reportes/ventas-por-cliente?${rango}`, []);
            const porProducto = useApi(`/api/reportes/ventas-por-producto?${rango}&top=15`, []);
            const [pctComision, setPctComision] = useState(''); // override opcional; vacío = % de cada vendedor (Usuarios.PorcentajeComision, 2% por defecto)
            const comisiones = useApi(`/api/reportes/comisiones-ventas?${rango}${pctComision !== '' ? `&porcentaje=${pctComision}` : ''}`, []);
            const r = resumen.datos;
            const dias = porDia.datos || [];
            const maxDia = Math.max(1, ...dias.map(d => d.totalVendido));

            return (
                <Pagina subtitulo="Indicadores comerciales, evolución diaria y rankings del período."
                    acciones={<>
                        <label className="sr-only" htmlFor="rv-desde">Desde</label><input id="rv-desde" type="date" className="erp-input w-auto" value={desde} onChange={e => setDesde(e.target.value)} />
                        <label className="sr-only" htmlFor="rv-hasta">Hasta</label><input id="rv-hasta" type="date" className="erp-input w-auto" value={hasta} onChange={e => setHasta(e.target.value)} />
                        <Boton variante="secundario" onClick={() => window.print()}>🖨️ Imprimir</Boton>
                    </>}>
                    <Kpis>
                        <Kpi icono="📅" titulo="Ventas de hoy" valor={formatCLP(r?.ventasHoy)} cargando={resumen.cargando} />
                        <Kpi icono="📆" titulo="Mes en curso" valor={formatCLP(r?.ventasMes)} detalle={`${r?.cantidadVentasMes ?? 0} documentos`} tono="verde" cargando={resumen.cargando} />
                        <Kpi icono="🎯" titulo="Ticket promedio (mes)" valor={formatCLP(r?.ticketPromedioMes)} tono="azul" cargando={resumen.cargando} />
                        <Kpi icono="⏳" titulo="Por cobrar / vencido" valor={formatCLP(r?.cuentasPorCobrar)} detalle={`Vencido: ${formatCLP(r?.cuentasVencidas)}`} tono="rojo" cargando={resumen.cargando} />
                    </Kpis>

                    <Card titulo="Ventas diarias" className="mb-6">
                        {porDia.cargando ? <Cargando /> : dias.length === 0 ? <Vacio icono="📉" titulo="Sin ventas en el período" /> : (
                            <div className="flex items-end gap-1 h-48 overflow-x-auto" role="img" aria-label="Gráfico de ventas diarias">
                                {dias.map(d => (
                                    <div key={d.fecha} className="flex flex-col items-center justify-end h-full min-w-[1.6rem] flex-1" title={`${formatFecha(d.fecha)}: ${formatCLP(d.totalVendido)} (${d.cantidadVentas} ventas)`}>
                                        <div className="w-full rounded-t mod-bg" style={{ height: `${Math.max(3, d.totalVendido / maxDia * 100)}%` }}></div>
                                        <div className="text-[10px] text-slate-500 mt-1">{new Date(d.fecha).getUTCDate()}</div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </Card>

                    <Card sinPadding titulo="Comisiones sugeridas por vendedor" className="mb-6" acciones={<>
                        <label htmlFor="rv-pct" className="text-sm text-slate-600" title="Vacío: se usa el % configurado en cada usuario (2% por defecto)">Forzar % (opcional)</label>
                        <input id="rv-pct" type="number" min="0" max="100" step="0.1" placeholder="por vendedor" className="erp-input w-32" value={pctComision} onChange={e => setPctComision(e.target.value)} />
                        <Boton variante="secundario" className="btn-chico" onClick={() => descargarCSV('comisiones_ventas.csv', comisiones.datos || [], [
                            { titulo: 'Vendedor', valor: c => c.vendedor }, { titulo: 'Ventas', valor: c => c.cantidadVentas }, { titulo: 'Neto vendido', valor: c => c.totalNeto },
                            { titulo: '% comisión', valor: c => c.porcentaje }, { titulo: 'Origen %', valor: c => c.origen }, { titulo: 'Comisión sugerida', valor: c => c.comisionSugerida }])}>CSV</Boton>
                    </>}>
                        <p className="px-4 pt-3 text-xs text-slate-500">Calculada sobre el neto vendido (sin IVA) por el usuario que emitió cada venta, excluyendo ventas anuladas.</p>
                        <Tabla filas={comisiones.datos} cargando={comisiones.cargando} claveFila={c => c.vendedor} vacio={<Vacio icono="💼" titulo="Sin ventas en el período" />} columnas={[
                            { titulo: 'Vendedor', render: c => <span className="font-semibold">{c.vendedor}</span> },
                            { titulo: 'Ventas', num: true, campo: 'cantidadVentas' },
                            { titulo: 'Neto vendido', num: true, render: c => formatCLP(c.totalNeto) },
                            { titulo: '% comisión', num: true, render: c => <span title={c.origen === 'usuario' ? 'Configurado en el usuario' : c.origen === 'override' ? 'Forzado en esta consulta' : 'Valor por defecto (2%)'}>{formatNumero(c.porcentaje)}% <Badge tono={c.origen === 'usuario' ? 'verde' : c.origen === 'override' ? 'azul' : 'gris'}>{c.origen === 'usuario' ? 'usuario' : c.origen === 'override' ? 'forzado' : 'defecto'}</Badge></span> },
                            { titulo: 'Comisión sugerida', num: true, render: c => <strong>{formatCLP(c.comisionSugerida)}</strong> }
                        ]} pie={(comisiones.datos || []).length > 0 && <tr><td colSpan="4" className="num">Total comisiones</td><td className="num">{formatCLP((comisiones.datos || []).reduce((s, c) => s + c.comisionSugerida, 0))}</td></tr>} />
                    </Card>

                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <Card sinPadding titulo="Top clientes" acciones={<Boton variante="secundario" className="btn-chico" onClick={() => descargarCSV('ventas_por_cliente.csv', porCliente.datos || [], [
                            { titulo: 'Cliente', valor: c => c.razonSocial }, { titulo: 'RUT', valor: c => c.rut }, { titulo: 'Ventas', valor: c => c.cantidadVentas }, { titulo: 'Total', valor: c => c.totalVendido }])}>CSV</Boton>}>
                            <Tabla filas={(porCliente.datos || []).slice(0, 15)} cargando={porCliente.cargando} claveFila={c => c.clienteId} vacio={<Vacio icono="👥" titulo="Sin ventas" />} columnas={[
                                { titulo: '#', render: c => (porCliente.datos.indexOf(c) + 1) },
                                { titulo: 'Cliente', render: c => <div><div className="font-semibold">{c.razonSocial}</div><div className="text-xs font-mono text-slate-500">{c.rut}</div></div> },
                                { titulo: 'Docs.', num: true, campo: 'cantidadVentas' },
                                { titulo: 'Total', num: true, render: c => formatCLP(c.totalVendido) }
                            ]} />
                        </Card>
                        <Card sinPadding titulo="Top productos" acciones={<Boton variante="secundario" className="btn-chico" onClick={() => descargarCSV('ventas_por_producto.csv', porProducto.datos || [], [
                            { titulo: 'SKU', valor: p => p.sku }, { titulo: 'Producto', valor: p => p.nombre }, { titulo: 'Unidades', valor: p => p.unidades }, { titulo: 'Neto', valor: p => p.totalNeto }, { titulo: 'Margen', valor: p => p.margen }])}>CSV</Boton>}>
                            <Tabla filas={porProducto.datos} cargando={porProducto.cargando} claveFila={p => p.productoId} vacio={<Vacio icono="🏷️" titulo="Sin ventas" />} columnas={[
                                { titulo: 'Producto', render: p => <div><div className="font-semibold">{p.nombre}</div><div className="text-xs font-mono text-slate-500">{p.sku}</div></div> },
                                { titulo: 'Unid.', num: true, render: p => formatNumero(p.unidades) },
                                { titulo: 'Neto', num: true, render: p => formatCLP(p.totalNeto) },
                                { titulo: 'Margen', num: true, render: p => <Badge tono={p.margen >= 0 ? 'verde' : 'rojo'}>{p.totalNeto ? Math.round(p.margen / p.totalNeto * 100) : 0}%</Badge> }
                            ]} />
                        </Card>
                    </div>
                </Pagina>
            );
        }

        montar(ReportesVentas);
    </script>
</body>
</html>
