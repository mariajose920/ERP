<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Inventario — Responsable: Adán -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajustes y alertas de inventario - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Ajustes manuales (POST /api/inventario/ajustes: kardex + asiento Merma/Inventario) y alertas de reorden.
        const { useState } = React;
        const MOTIVOS = ['Merma', 'Pérdida / robo', 'Producto dañado', 'Sobrante en conteo', 'Inventario inicial', 'Corrección de digitación'];

        function AjustesAlertas() {
            const stock = useApi('/api/inventario/stock', []);
            const alertas = useApi('/api/inventario/alertas-reorden', []);
            const ajustes = useApi('/api/inventario/ajustes?top=50', []);
            const [form, setForm] = useState({ productoId: '', tipo: 'salida', cantidad: '', motivo: MOTIVOS[0], detalle: '' });
            const [guardando, setGuardando] = useState(false);
            const puedeAjustar = ErpAuth.tienePermiso('inventario.ajustes.crear');

            const producto = (stock.datos || []).find(p => p.id === Number(form.productoId));
            const cantidad = Number(form.cantidad) || 0;
            const delta = form.tipo === 'salida' ? -cantidad : cantidad;
            const nuevoStock = producto ? producto.stockActual + delta : 0;

            const registrar = async (e) => {
                e.preventDefault();
                if (!producto || cantidad <= 0) { mostrarToast('Seleccione producto y una cantidad mayor a 0.', 'aviso'); return; }
                if (nuevoStock < 0) { mostrarToast('El ajuste dejaría el stock en negativo.', 'error'); return; }
                const valor = cantidad * producto.costoPromedioPonderado;
                const ok = await confirmar({
                    titulo: 'Confirmar ajuste de inventario', peligro: form.tipo === 'salida', textoConfirmar: 'Registrar ajuste',
                    mensaje: `${producto.nombre}: ${formatNumero(producto.stockActual)} → ${formatNumero(nuevoStock)} ${producto.unidadMedida}.\n` +
                        `Se generará un asiento por ${formatCLP(valor)} (${form.tipo === 'salida' ? 'Gasto/Merma contra Inventario' : 'Inventario contra recupero'}).`
                });
                if (!ok) return;
                setGuardando(true);
                try {
                    const a = await apiFetch('/api/inventario/ajustes', { method: 'POST', body: {
                        productoId: producto.id, cantidadAjuste: delta, motivo: form.detalle ? `${form.motivo}: ${form.detalle}` : form.motivo } });
                    mostrarToast(`Ajuste ${a.numeroAjuste} registrado.`, 'exito');
                    setForm({ ...form, cantidad: '', detalle: '' });
                    stock.recargar(); alertas.recargar(); ajustes.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
                finally { setGuardando(false); }
            };

            const listaAlertas = alertas.datos || [];
            return (
                <Pagina subtitulo="Ajustes de stock con impacto contable y productos que requieren reposición.">
                    <Kpis>
                        <Kpi icono="⛔" titulo="Sin stock" valor={listaAlertas.filter(p => p.stockActual <= 0).length} tono="rojo" cargando={alertas.cargando} />
                        <Kpi icono="⚠️" titulo="Bajo reorden" valor={listaAlertas.filter(p => p.stockActual > 0).length} tono="amarillo" cargando={alertas.cargando} />
                        <Kpi icono="🛠️" titulo="Ajustes recientes" valor={(ajustes.datos || []).length} detalle="Últimos 50" cargando={ajustes.cargando} />
                        <Kpi icono="📉" titulo="Mermas valorizadas" valor={formatCLP((ajustes.datos || []).filter(a => a.cantidadAjuste < 0).reduce((s, a) => s + Math.abs(a.cantidadAjuste) * a.costoUnitario, 0))} detalle="En los últimos 50 ajustes" tono="rojo" cargando={ajustes.cargando} />
                    </Kpis>

                    <div className="grid grid-cols-1 lg:grid-cols-5 gap-6 mb-6">
                        <Card titulo="🚨 Alertas de reorden" className="lg:col-span-3" sinPadding>
                            <Tabla filas={listaAlertas} cargando={alertas.cargando}
                                vacio={<Vacio icono="✅" titulo="Todo en orden" texto="Ningún producto está bajo su punto de reorden." />}
                                filaClase={p => p.stockActual <= 0 ? 'bg-rose-50' : 'bg-orange-50'}
                                columnas={[
                                    { titulo: 'Producto', render: p => <div><div className="font-semibold">{p.nombre}</div><div className="text-xs font-mono text-slate-500">{p.sku}</div></div> },
                                    { titulo: 'Stock', num: true, render: p => <strong>{formatNumero(p.stockActual)}</strong> },
                                    { titulo: 'Reorden', num: true, render: p => formatNumero(p.puntoReorden) },
                                    { titulo: 'Cobertura', render: p => <div className="w-28"><Progreso valor={p.stockActual} maximo={p.puntoReorden || 1} /></div> },
                                    { titulo: 'Estado', render: p => <BadgeStock stock={p.stockActual} puntoReorden={p.puntoReorden} /> },
                                    { titulo: '', render: p => <a className="btn btn-secundario btn-chico" href={`pantalla_kardex_inventario.html?producto=${p.id}`}>Kardex</a> }
                                ]} />
                        </Card>

                        <Card titulo="🛠️ Nuevo ajuste" className="lg:col-span-2">
                            {!puedeAjustar ? <Vacio icono="🔒" titulo="Solo lectura" texto="Su perfil no puede registrar ajustes." /> : (
                                <form onSubmit={registrar} className="space-y-4">
                                    <Campo etiqueta="Producto *" id="a-prod">
                                        <select id="a-prod" className="erp-input" value={form.productoId} onChange={e => setForm({ ...form, productoId: e.target.value })}>
                                            <option value="">Seleccione...</option>
                                            {(stock.datos || []).map(p => <option key={p.id} value={p.id}>{p.sku} · {p.nombre} (stock {formatNumero(p.stockActual)})</option>)}
                                        </select>
                                    </Campo>
                                    <div className="grid grid-cols-2 gap-3">
                                        <Campo etiqueta="Tipo" id="a-tipo">
                                            <select id="a-tipo" className="erp-input" value={form.tipo} onChange={e => setForm({ ...form, tipo: e.target.value })}>
                                                <option value="salida">Salida (−)</option><option value="entrada">Entrada (+)</option>
                                            </select>
                                        </Campo>
                                        <Campo etiqueta="Cantidad *" id="a-cant">
                                            <input id="a-cant" type="number" min="0" step="any" className="erp-input" value={form.cantidad} onChange={e => setForm({ ...form, cantidad: e.target.value })} />
                                        </Campo>
                                    </div>
                                    <Campo etiqueta="Motivo" id="a-mot">
                                        <select id="a-mot" className="erp-input" value={form.motivo} onChange={e => setForm({ ...form, motivo: e.target.value })}>
                                            {MOTIVOS.map(m => <option key={m}>{m}</option>)}
                                        </select>
                                    </Campo>
                                    <Campo etiqueta="Detalle" id="a-det"><input id="a-det" className="erp-input" value={form.detalle} onChange={e => setForm({ ...form, detalle: e.target.value })} /></Campo>
                                    {producto && cantidad > 0 && (
                                        <div className={`rounded-lg p-3 text-sm ${nuevoStock < 0 ? 'bg-rose-50 text-rose-800' : 'mod-bg-suave'}`}>
                                            Stock resultante: <strong>{formatNumero(nuevoStock)}</strong> · Valor del ajuste: <strong>{formatCLP(cantidad * producto.costoPromedioPonderado)}</strong>
                                        </div>
                                    )}
                                    <Boton type="submit" cargando={guardando} className="w-full">Registrar ajuste</Boton>
                                </form>
                            )}
                        </Card>
                    </div>

                    <Card sinPadding titulo="Historial de ajustes">
                        <Tabla filas={ajustes.datos} cargando={ajustes.cargando} vacio={<Vacio icono="🛠️" titulo="Sin ajustes registrados" />} columnas={[
                            { titulo: 'N°', render: a => <span className="font-mono font-semibold">{a.numeroAjuste}</span> },
                            { titulo: 'Fecha', render: a => formatFecha(a.fecha, true) },
                            { titulo: 'Producto', render: a => a.producto?.nombre },
                            { titulo: 'Ajuste', num: true, render: a => <Badge tono={a.cantidadAjuste < 0 ? 'rojo' : 'verde'}>{a.cantidadAjuste > 0 ? '+' : ''}{formatNumero(a.cantidadAjuste)}</Badge> },
                            { titulo: 'Stock', num: true, render: a => `${formatNumero(a.cantidadAnterior)} → ${formatNumero(a.cantidadNueva)}` },
                            { titulo: 'Valor', num: true, render: a => formatCLP(Math.abs(a.cantidadAjuste) * a.costoUnitario) },
                            { titulo: 'Motivo', campo: 'motivo' },
                            { titulo: 'Asiento', render: a => a.asientoContableId ? <Badge tono="violeta">Contabilizado</Badge> : <Badge tono="gris">Sin valor</Badge> },
                            { titulo: 'Usuario', campo: 'creadoPor' }
                        ]} />
                    </Card>
                </Pagina>
            );
        }

        montar(AjustesAlertas);
    </script>
</body>
</html>
