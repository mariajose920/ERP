<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Compras — Responsable: Adán -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Órdenes de compra - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Órdenes de compra: /api/compras/ordenes (listar, crear, aprobar, anular). El IVA y el número los calcula la API.
        // Flujo: Pendiente → (aprobar) Aprobada → recepción → facturación → Liquidada.
        const { useState, useMemo } = React;
        const TASA_IVA = 0.19;

        /** Avance de recepción de una OC: total recibido / total pedido (en unidades). */
        const avance = (o) => {
            const pedido = (o.detalles || []).reduce((s, d) => s + Number(d.cantidad), 0);
            const recibido = (o.detalles || []).reduce((s, d) => s + Number(d.cantidadRecibida), 0);
            return { pedido, recibido };
        };

        function OrdenesCompra() {
            const ordenes = useApi('/api/compras/ordenes', []);
            const proveedores = useApi('/api/proveedores', []);
            const productos = useApi('/api/maestros/productos', []);
            const [busqueda, setBusqueda] = useState('');
            const [estado, setEstado] = useState('TODOS');
            const [detalle, setDetalle] = useState(null);
            const [nueva, setNueva] = useState(null);
            const [guardando, setGuardando] = useState(false);
            const puedeEscribir = ErpAuth.tienePermiso('compras.ordenes.escribir');

            const lista = ordenes.datos || [];
            const filtradas = useMemo(() => lista.filter(o =>
                (estado === 'TODOS' || o.estado === estado) &&
                normalizar(`${o.numeroOrden} ${o.proveedor?.razonSocial} ${o.observaciones}`).includes(normalizar(busqueda))
            ), [lista, estado, busqueda]);

            const abiertas = lista.filter(o => o.estado === 'Pendiente' || o.estado === 'Aprobada' || o.estado === 'RecibidaParcial');
            const porAprobar = lista.filter(o => o.estado === 'Pendiente');

            // ---- Nueva orden ----
            const abrirNueva = () => setNueva({ proveedorId: '', fechaEntregaEsperada: '', observaciones: '', items: [{ productoId: '', cantidad: 1, precioUnitario: 0 }] });
            const cambiarItem = (i, campo, valor) => {
                const items = nueva.items.map((it, j) => {
                    if (j !== i) return it;
                    const nuevo = { ...it, [campo]: valor };
                    if (campo === 'productoId') {
                        const p = (productos.datos || []).find(x => x.id === Number(valor));
                        if (p) nuevo.precioUnitario = p.costoBase || p.costoPromedioPonderado || 0;
                    }
                    return nuevo;
                });
                setNueva({ ...nueva, items });
            };
            const neto = nueva ? nueva.items.reduce((s, it) => s + Number(it.cantidad || 0) * Number(it.precioUnitario || 0), 0) : 0;

            const guardar = async (e) => {
                e.preventDefault();
                const items = nueva.items.filter(it => it.productoId);
                if (!nueva.proveedorId || items.length === 0) { mostrarToast('Seleccione proveedor y al menos un producto.', 'aviso'); return; }
                setGuardando(true);
                try {
                    const oc = await apiFetch('/api/compras/ordenes', {
                        method: 'POST', body: {
                            proveedorId: Number(nueva.proveedorId),
                            fechaEntregaEsperada: nueva.fechaEntregaEsperada || null,
                            observaciones: nueva.observaciones || null,
                            items: items.map(it => ({ productoId: Number(it.productoId), cantidad: Number(it.cantidad), precioUnitario: Number(it.precioUnitario) }))
                        }
                    });
                    mostrarToast(`Orden ${oc.numeroOrden} creada por ${formatCLP(oc.total)}.`, 'exito');
                    setNueva(null);
                    ordenes.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
                finally { setGuardando(false); }
            };

            const aprobar = async (o) => {
                const ok = await confirmar({
                    titulo: `Aprobar ${o.numeroOrden}`, textoConfirmar: 'Aprobar orden',
                    mensaje: `Total ${formatCLP(o.total)} a ${o.proveedor?.razonSocial}.\nUna vez aprobada, la orden queda habilitada para recibir mercadería.`
                });
                if (!ok) return;
                try {
                    await apiFetch(`/api/compras/ordenes/${o.id}/aprobar`, { method: 'POST' });
                    mostrarToast(`Orden ${o.numeroOrden} aprobada.`, 'exito');
                    setDetalle(null);
                    ordenes.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
            };

            const anular = async (o) => {
                const motivo = await confirmar({
                    titulo: `Anular ${o.numeroOrden}`, peligro: true, textoConfirmar: 'Anular orden', pedirMotivo: true,
                    mensaje: 'Solo se pueden anular órdenes sin recepciones ni facturas. Esta acción no se puede deshacer.'
                });
                if (!motivo) return;
                try {
                    await apiFetch(`/api/compras/ordenes/${o.id}/anular`, { method: 'POST', body: { motivo } });
                    mostrarToast(`Orden ${o.numeroOrden} anulada.`, 'exito');
                    setDetalle(null);
                    ordenes.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
            };

            const columnas = [
                { titulo: 'N° orden', render: o => <span className="font-mono font-semibold">{o.numeroOrden}</span> },
                { titulo: 'Fecha', render: o => formatFecha(o.fechaEmision) },
                { titulo: 'Proveedor', render: o => o.proveedor?.razonSocial },
                { titulo: 'Estado', render: o => <BadgeEstadoOC estado={o.estado} /> },
                { titulo: 'Recepción', render: o => { const a = avance(o); return <div className="w-36"><Progreso valor={a.recibido} maximo={a.pedido} etiqueta={`${formatNumero(a.recibido)} de ${formatNumero(a.pedido)} unidades`} /></div>; } },
                { titulo: 'Total', num: true, render: o => formatCLP(o.total) },
                { titulo: '', render: o => <button className="btn btn-secundario btn-chico" onClick={() => setDetalle(o)} aria-label={`Ver ${o.numeroOrden}`}>Ver</button> }
            ];

            return (
                <Pagina subtitulo="Emisión y seguimiento de órdenes de compra a proveedores."
                    acciones={puedeEscribir && <Boton onClick={abrirNueva}>➕ Nueva orden</Boton>}>
                    <Kpis>
                        <Kpi icono="⏳" titulo="Por aprobar" valor={porAprobar.length} detalle="Pendientes de aprobación" tono="naranjo" cargando={ordenes.cargando} />
                        <Kpi icono="📋" titulo="Órdenes abiertas" valor={abiertas.length} detalle="Sin recibir por completo" tono="amarillo" cargando={ordenes.cargando} />
                        <Kpi icono="💰" titulo="Monto abierto" valor={formatCLP(abiertas.reduce((s, o) => s + o.total, 0))} cargando={ordenes.cargando} />
                        <Kpi icono="📦" titulo="Por facturar" valor={lista.filter(o => o.estado === 'RecibidaTotal').length} detalle="Recibidas en su totalidad" tono="violeta" cargando={ordenes.cargando} />
                        <Kpi icono="✅" titulo="Liquidadas" valor={lista.filter(o => o.estado === 'Liquidada').length} tono="verde" cargando={ordenes.cargando} />
                    </Kpis>

                    <Card sinPadding titulo="Órdenes de compra" acciones={<>
                        <Buscador valor={busqueda} onCambio={setBusqueda} placeholder="N° orden, proveedor u observación" />
                        <label className="sr-only" htmlFor="f-estado">Estado</label>
                        <select id="f-estado" className="erp-input w-auto" value={estado} onChange={e => setEstado(e.target.value)}>
                            <option value="TODOS">Todos los estados</option>
                            <option value="Pendiente">Pendiente de aprobación</option><option value="Aprobada">Aprobada</option><option value="RecibidaParcial">Recepción parcial</option>
                            <option value="RecibidaTotal">Recibida total</option><option value="Liquidada">Liquidada</option><option value="Anulada">Anulada</option>
                        </select>
                    </>}>
                        <Tabla columnas={columnas} filas={filtradas} cargando={ordenes.cargando}
                            vacio={<Vacio icono="📋" titulo="Sin órdenes de compra" texto="Cree la primera orden con el botón “Nueva orden”." />} />
                    </Card>

                    {/* Detalle con progreso por línea */}
                    <Modal abierto={!!detalle} ancho titulo={detalle ? `Orden ${detalle.numeroOrden}` : ''} onCerrar={() => setDetalle(null)}
                        pie={detalle && <>
                            {puedeEscribir && (detalle.estado === 'Pendiente' || detalle.estado === 'Aprobada') && <button className="btn btn-peligro" onClick={() => anular(detalle)}>Anular orden</button>}
                            {puedeEscribir && detalle.estado === 'Pendiente' && <button className="btn btn-primario" onClick={() => aprobar(detalle)}>✅ Aprobar orden</button>}
                            <button className="btn btn-secundario" onClick={() => setDetalle(null)}>Cerrar</button>
                        </>}>
                        {detalle && (
                            <div className="space-y-4">
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
                                    <div><div className="erp-kpi-titulo">Proveedor</div>{detalle.proveedor?.razonSocial}</div>
                                    <div><div className="erp-kpi-titulo">Emisión</div>{formatFecha(detalle.fechaEmision)}</div>
                                    <div><div className="erp-kpi-titulo">Entrega esperada</div>{formatFecha(detalle.fechaEntregaEsperada) || '—'}</div>
                                    <div><div className="erp-kpi-titulo">Estado</div><BadgeEstadoOC estado={detalle.estado} /></div>
                                </div>
                                <Tabla filas={detalle.detalles} columnas={[
                                    { titulo: 'Producto', render: d => <div><div className="font-semibold">{d.producto?.nombre}</div><div className="text-xs font-mono text-slate-500">{d.producto?.sku}</div></div> },
                                    { titulo: 'Pedido', num: true, render: d => formatNumero(d.cantidad) },
                                    { titulo: 'Recibido', num: true, render: d => formatNumero(d.cantidadRecibida) },
                                    { titulo: 'Avance', render: d => <div className="w-32"><Progreso valor={d.cantidadRecibida} maximo={d.cantidad} /></div> },
                                    { titulo: 'Precio', num: true, render: d => formatCLP(d.precioUnitario) },
                                    { titulo: 'Subtotal', num: true, render: d => formatCLP(d.subtotal) }
                                ]} pie={<>
                                    <tr><td colSpan="5" className="num">Neto</td><td className="num">{formatCLP(detalle.subtotal)}</td></tr>
                                    <tr><td colSpan="5" className="num">IVA</td><td className="num">{formatCLP(detalle.impuestoIva)}</td></tr>
                                    <tr><td colSpan="5" className="num">Total</td><td className="num">{formatCLP(detalle.total)}</td></tr>
                                </>} />
                                {(detalle.aprobadoPor || detalle.fechaAprobacion) && (
                                    <p className="text-sm text-slate-600"><strong>Aprobada por:</strong> {detalle.aprobadoPor || '—'} · {formatFecha(detalle.fechaAprobacion, true)}</p>
                                )}
                                {detalle.estado === 'Anulada' && (
                                    <p className="text-sm text-rose-700"><strong>Anulada por:</strong> {detalle.anuladoPor || '—'} · {formatFecha(detalle.fechaAnulacion, true)} · <strong>Motivo:</strong> {detalle.motivoAnulacion || '—'}</p>
                                )}
                                {detalle.observaciones && <p className="text-sm text-slate-600"><strong>Observaciones:</strong> {detalle.observaciones}</p>}
                            </div>
                        )}
                    </Modal>

                    {/* Nueva orden */}
                    <Modal abierto={!!nueva} ancho titulo="Nueva orden de compra" onCerrar={() => setNueva(null)}
                        pie={<><button className="btn btn-secundario" onClick={() => setNueva(null)}>Cancelar</button>
                            <Boton type="submit" form="form-oc" cargando={guardando}>Emitir orden</Boton></>}>
                        {nueva && (
                            <form id="form-oc" onSubmit={guardar} className="space-y-4">
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                    <Campo etiqueta="Proveedor *" id="oc-prov">
                                        <select id="oc-prov" className="erp-input" value={nueva.proveedorId} onChange={e => setNueva({ ...nueva, proveedorId: e.target.value })} required>
                                            <option value="">Seleccione...</option>
                                            {(proveedores.datos || []).map(p => <option key={p.id} value={p.id}>{p.razonSocial}</option>)}
                                        </select>
                                    </Campo>
                                    <Campo etiqueta="Entrega esperada" id="oc-fecha">
                                        <input id="oc-fecha" type="date" className="erp-input" value={nueva.fechaEntregaEsperada} onChange={e => setNueva({ ...nueva, fechaEntregaEsperada: e.target.value })} />
                                    </Campo>
                                    <Campo etiqueta="Observaciones" id="oc-obs">
                                        <input id="oc-obs" className="erp-input" value={nueva.observaciones} onChange={e => setNueva({ ...nueva, observaciones: e.target.value })} />
                                    </Campo>
                                </div>
                                <div className="space-y-2">
                                    {nueva.items.map((it, i) => (
                                        <div key={i} className="grid grid-cols-12 gap-2 items-end">
                                            <Campo etiqueta={`Producto ${i + 1}`} id={`oc-p-${i}`} className="col-span-12 sm:col-span-6">
                                                <select id={`oc-p-${i}`} className="erp-input" value={it.productoId} onChange={e => cambiarItem(i, 'productoId', e.target.value)}>
                                                    <option value="">Seleccione...</option>
                                                    {(productos.datos || []).map(p => <option key={p.id} value={p.id}>{p.sku} · {p.nombre}</option>)}
                                                </select>
                                            </Campo>
                                            <Campo etiqueta="Cantidad" id={`oc-c-${i}`} className="col-span-4 sm:col-span-2">
                                                <input id={`oc-c-${i}`} type="number" min="0.0001" step="any" className="erp-input" value={it.cantidad} onChange={e => cambiarItem(i, 'cantidad', e.target.value)} />
                                            </Campo>
                                            <Campo etiqueta="Precio neto" id={`oc-u-${i}`} className="col-span-5 sm:col-span-3">
                                                <input id={`oc-u-${i}`} type="number" min="0" step="any" className="erp-input" value={it.precioUnitario} onChange={e => cambiarItem(i, 'precioUnitario', e.target.value)} />
                                            </Campo>
                                            <button type="button" className="btn btn-secundario btn-icono col-span-3 sm:col-span-1" aria-label={`Quitar producto ${i + 1}`}
                                                onClick={() => setNueva({ ...nueva, items: nueva.items.filter((_, j) => j !== i) })} disabled={nueva.items.length === 1}>🗑️</button>
                                        </div>
                                    ))}
                                    <button type="button" className="btn btn-secundario btn-chico" onClick={() => setNueva({ ...nueva, items: [...nueva.items, { productoId: '', cantidad: 1, precioUnitario: 0 }] })}>➕ Agregar línea</button>
                                </div>
                                <div className="mod-bg-suave rounded-lg p-3 text-sm flex flex-wrap gap-6 justify-end">
                                    <span>Neto: <strong>{formatCLP(neto)}</strong></span>
                                    <span>IVA (19%): <strong>{formatCLP(Math.round(neto * TASA_IVA))}</strong></span>
                                    <span>Total estimado: <strong className="mod-texto">{formatCLP(neto + Math.round(neto * TASA_IVA))}</strong></span>
                                </div>
                            </form>
                        )}
                    </Modal>
                </Pagina>
            );
        }

        montar(OrdenesCompra);
    </script>
</body>
</html>
