<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Módulo: Ventas — Responsable: María -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de ventas - ERP Corporativo</title>
    <script src="shared/erp-common.js"></script>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="stylesheet" href="shared/erp-ui.css">
    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
</head>
<body>
    <div id="erp-navbar"></div>
    <script src="shared/navbar.js"></script>
    <div id="root"></div>
    <script type="text/babel" src="shared/erp-ui.jsx"></script>
    <script type="text/babel">
        // Historial de ventas: GET /api/ventas; anulación con modal y motivo (POST /api/ventas/{id}/anular, M2/M6).
        const { useState, useMemo } = React;

        function Historial() {
            const ventas = useApi('/api/ventas', []);
            const [busqueda, setBusqueda] = useState('');
            const [estado, setEstado] = useState('');
            const [metodo, setMetodo] = useState('');
            const [desde, setDesde] = useState('');
            const [hasta, setHasta] = useState('');
            const [detalle, setDetalle] = useState(null);
            const puedeAnular = ErpAuth.tienePermiso('ventas.documentos.anular');

            const filtradas = useMemo(() => (ventas.datos || []).filter(v => {
                const f = fechaISO(new Date(v.fechaEmision));
                return (!estado || v.estado === estado) && (!metodo || v.metodoPago === metodo) &&
                    (!desde || f >= desde) && (!hasta || f <= hasta) &&
                    normalizar(`${v.numeroFactura} ${v.cliente?.razonSocial} ${v.cliente?.rut}`).includes(normalizar(busqueda));
            }), [ventas.datos, busqueda, estado, metodo, desde, hasta]);
            const vigentes = filtradas.filter(v => v.estado !== 'Anulada');

            const anular = async (v) => {
                const motivo = await confirmar({
                    titulo: `Anular ${v.numeroFactura}`, peligro: true, textoConfirmar: 'Anular venta', pedirMotivo: true, etiquetaMotivo: 'Motivo de la anulación',
                    mensaje: `Se repondrá el stock y se generarán los asientos de reversa por ${formatCLP(v.total)}.\nNo es posible anular ventas con abonos registrados.`
                });
                if (!motivo) return;
                try {
                    await apiFetch(`/api/ventas/${v.id}/anular`, { method: 'POST', body: { motivo } });
                    mostrarToast(`Venta ${v.numeroFactura} anulada.`, 'exito');
                    setDetalle(null);
                    ventas.recargar();
                } catch (err) { mostrarToast(err.message, 'error'); }
            };

            return (
                <Pagina subtitulo="Todas las ventas emitidas, con detalle, pagos y anulación."
                    acciones={<Boton variante="secundario" onClick={() => descargarCSV('ventas.csv', filtradas, [
                        { titulo: 'Documento', valor: v => v.numeroFactura }, { titulo: 'Fecha', valor: v => formatFecha(v.fechaEmision, true) },
                        { titulo: 'Cliente', valor: v => v.cliente?.razonSocial }, { titulo: 'Método', valor: v => v.metodoPago },
                        { titulo: 'Estado', valor: v => v.estado }, { titulo: 'Total', valor: v => v.total }, { titulo: 'Saldo', valor: v => v.saldoPendiente }])}>⬇️ Exportar CSV</Boton>}>
                    <Kpis>
                        <Kpi icono="🧾" titulo="Ventas (filtro)" valor={vigentes.length} cargando={ventas.cargando} />
                        <Kpi icono="💰" titulo="Total vendido" valor={formatCLP(vigentes.reduce((s, v) => s + v.total, 0))} tono="verde" cargando={ventas.cargando} />
                        <Kpi icono="🎯" titulo="Ticket promedio" valor={formatCLP(vigentes.length ? vigentes.reduce((s, v) => s + v.total, 0) / vigentes.length : 0)} tono="azul" cargando={ventas.cargando} />
                        <Kpi icono="🚫" titulo="Anuladas" valor={filtradas.length - vigentes.length} tono="rojo" cargando={ventas.cargando} />
                    </Kpis>
                    <Card sinPadding titulo="Ventas" acciones={<>
                        <Buscador valor={busqueda} onCambio={setBusqueda} placeholder="Documento, cliente o RUT" />
                        <label className="sr-only" htmlFor="h-estado">Estado</label>
                        <select id="h-estado" className="erp-input w-auto" value={estado} onChange={e => setEstado(e.target.value)}>
                            <option value="">Todos los estados</option><option value="Pagada">Pagada</option><option value="Emitida">Pendiente de pago</option>
                            <option value="ParcialmentePagada">Abono parcial</option><option value="Anulada">Anulada</option>
                        </select>
                        <label className="sr-only" htmlFor="h-metodo">Método</label>
                        <select id="h-metodo" className="erp-input w-auto" value={metodo} onChange={e => setMetodo(e.target.value)}>
                            <option value="">Todos los pagos</option>{['Efectivo', 'Tarjeta', 'Transferencia', 'Credito'].map(m => <option key={m}>{m}</option>)}
                        </select>
                        <label className="sr-only" htmlFor="h-desde">Desde</label><input id="h-desde" type="date" className="erp-input w-auto" value={desde} onChange={e => setDesde(e.target.value)} />
                        <label className="sr-only" htmlFor="h-hasta">Hasta</label><input id="h-hasta" type="date" className="erp-input w-auto" value={hasta} onChange={e => setHasta(e.target.value)} />
                    </>}>
                        <Tabla filas={filtradas} cargando={ventas.cargando} onFila={setDetalle} vacio={<Vacio icono="📦" titulo="Sin ventas para el filtro" />} columnas={[
                            { titulo: 'Documento', render: v => <span className="font-mono font-semibold">{v.numeroFactura}</span> },
                            { titulo: 'Fecha', render: v => formatFecha(v.fechaEmision, true) },
                            { titulo: 'Cliente', render: v => v.cliente?.razonSocial },
                            { titulo: 'Pago', render: v => <Badge tono={v.metodoPago === 'Credito' ? 'amarillo' : 'modulo'}>{v.metodoPago}</Badge> },
                            { titulo: 'Estado', render: v => <BadgeEstadoVenta estado={v.estado} /> },
                            { titulo: 'Vendedor', render: v => <span className="text-xs">{v.creadoPor}</span> },
                            { titulo: 'Total', num: true, render: v => formatCLP(v.total) },
                            { titulo: 'Saldo', num: true, render: v => v.saldoPendiente > 0 ? <span className="text-rose-700 font-semibold">{formatCLP(v.saldoPendiente)}</span> : '—' }
                        ]} />
                    </Card>

                    <Modal abierto={!!detalle} ancho imprimible titulo={detalle ? `Comprobante ${detalle.numeroFactura}` : ''} onCerrar={() => setDetalle(null)}
                        pie={detalle && <>
                            {puedeAnular && detalle.estado !== 'Anulada' && <button className="btn btn-peligro" onClick={() => anular(detalle)}>Anular venta</button>}
                            <button className="btn btn-secundario" onClick={() => window.print()}>🖨️ Imprimir</button>
                            <button className="btn btn-primario" onClick={() => setDetalle(null)}>Cerrar</button>
                        </>}>
                        {detalle && (
                            <div className="space-y-4 text-sm">
                                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                    <div><div className="erp-kpi-titulo">Cliente</div>{detalle.cliente?.razonSocial}<div className="font-mono text-xs">{detalle.cliente?.rut}</div></div>
                                    <div><div className="erp-kpi-titulo">Emisión</div>{formatFecha(detalle.fechaEmision, true)}</div>
                                    <div><div className="erp-kpi-titulo">Pago</div>{detalle.metodoPago}{detalle.fechaVencimiento && detalle.metodoPago === 'Credito' && <div className="text-xs">Vence {formatFecha(detalle.fechaVencimiento)}</div>}</div>
                                    <div><div className="erp-kpi-titulo">Estado</div><BadgeEstadoVenta estado={detalle.estado} /></div>
                                </div>
                                <Tabla filas={detalle.detalles} columnas={[
                                    { titulo: 'Producto', render: d => d.producto?.nombre },
                                    { titulo: 'Cant.', num: true, render: d => formatNumero(d.cantidad) },
                                    { titulo: 'Precio', num: true, render: d => formatCLP(d.precioUnitario) },
                                    { titulo: 'Descuento', num: true, render: d => d.descuento ? formatCLP(d.descuento) : '—' },
                                    { titulo: 'Subtotal (IVA incl.)', num: true, render: d => formatCLP(d.cantidad * d.precioUnitario - d.descuento) }
                                ]} pie={<>
                                    <tr><td colSpan="4" className="num">Total pagado</td><td className="num">{formatCLP(detalle.total)}</td></tr>
                                    <tr><td colSpan="4" className="num text-xs">Neto (sin IVA)</td><td className="num text-xs">{formatCLP(detalle.subtotal)}</td></tr>
                                    <tr><td colSpan="4" className="num text-xs">IVA 19% incluido en el total</td><td className="num text-xs">{formatCLP(detalle.impuestoIva)}</td></tr>
                                </>} />
                                {detalle.pagos?.length > 0 && <div><div className="erp-kpi-titulo mb-1">Abonos</div>
                                    <Tabla filas={detalle.pagos} columnas={[
                                        { titulo: 'Fecha', render: p => formatFecha(p.fechaPago, true) }, { titulo: 'Medio', campo: 'metodoPago' },
                                        { titulo: 'Comprobante', render: p => p.referenciaComprobante || '—' }, { titulo: 'Monto', num: true, render: p => formatCLP(p.monto) }]} /></div>}
                                {detalle.estado === 'Anulada' && (
                                    <p className="text-rose-700"><strong>Anulada por:</strong> {detalle.anuladoPor || '—'} · {formatFecha(detalle.fechaAnulacion, true)} · <strong>Motivo:</strong> {detalle.motivoAnulacion || '—'}</p>
                                )}
                                {detalle.observaciones && <p className="text-slate-600"><strong>Observaciones:</strong> {detalle.observaciones}</p>}
                            </div>
                        )}
                    </Modal>
                </Pagina>
            );
        }

        montar(Historial);
    </script>
</body>
</html>
