<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial Ventas Directas - ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
    
    <!-- NAVBAR RESPONSIVA -->
    <nav class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🏢</span>
                    <span class="font-bold text-xl tracking-wider hidden lg:block">ERP CORPORATIVO</span>
                </div>
                <div class="hidden lg:block">
                    <div class="ml-10 flex items-baseline space-x-2" id="desktop-menu">
                        <a href="index_erp.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white transition-colors" data-path="index_erp.html">🏠 Inicio</a>
                        <a href="pantalla_gestion_clientes.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white transition-colors" data-path="pantalla_gestion_clientes.html">👥 Clientes</a>
                        <a href="pantalla_emision_ventas.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white transition-colors" data-path="pantalla_emision_ventas.html">🧾 POS Ventas</a>
                        <a href="pantalla_historial_directas.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white transition-colors" data-path="pantalla_historial_directas.html">📦 Historial Directas</a>
                        <a href="pantalla_cobranzas_plazo.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white transition-colors" data-path="pantalla_cobranzas_plazo.html">⏳ Cobranzas Plazo</a>
                    </div>
                </div>
                <div class="lg:hidden">
                    <button id="mobile-menu-btn" class="inline-flex items-center justify-center p-2 rounded-md text-indigo-200 hover:text-white hover:bg-indigo-700 focus:outline-none">
                        <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
                            <path id="icon-menu" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                            <path id="icon-close" class="hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
        <div id="mobile-menu" class="hidden lg:hidden bg-indigo-800">
            <div class="px-2 pt-2 pb-3 space-y-1 sm:px-3">
                <a href="index_erp.html" class="nav-link block px-3 py-2 rounded-md text-base font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white" data-path="index_erp.html">🏠 Inicio</a>
                <a href="pantalla_gestion_clientes.html" class="nav-link block px-3 py-2 rounded-md text-base font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white" data-path="pantalla_gestion_clientes.html">👥 Clientes</a>
                <a href="pantalla_emision_ventas.html" class="nav-link block px-3 py-2 rounded-md text-base font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white" data-path="pantalla_emision_ventas.html">🧾 POS Ventas</a>
                <a href="pantalla_historial_directas.html" class="nav-link block px-3 py-2 rounded-md text-base font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white" data-path="pantalla_historial_directas.html">📦 Historial Directas</a>
                <a href="pantalla_cobranzas_plazo.html" class="nav-link block px-3 py-2 rounded-md text-base font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white" data-path="pantalla_cobranzas_plazo.html">⏳ Cobranzas Plazo</a>
            </div>
        </div>
    </nav>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');
            const iconMenu = document.getElementById('icon-menu');
            const iconClose = document.getElementById('icon-close');
            if(btn) {
                btn.addEventListener('click', () => {
                    menu.classList.toggle('hidden');
                    iconMenu.classList.toggle('hidden');
                    iconClose.classList.toggle('hidden');
                });
            }
            const currentPath = window.location.pathname.split('/').pop() || 'index_erp.html';
            document.querySelectorAll('.nav-link').forEach(link => {
                if(link.getAttribute('data-path') === currentPath) {
                    link.classList.remove('text-indigo-200');
                    link.classList.add('bg-indigo-700', 'text-white');
                }
            });
        });
    </script>
    <!-- FIN NAVBAR -->

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        const MOCK_VENTAS_DIRECTAS = [
            { id: 1001, fecha: '2026-09-01', cliente: 'CLIENTE GENÉRICO (Venta Rápida)', tipoDoc: 'BOLETA', formaPago: 'EFECTIVO', total: 15000, productos: [{ sku: 'ACC-001', nombre: 'TECLADO MECÁNICO', cant: 1, total: 10000 }, { sku: 'CBL-001', nombre: 'CABLE RED 5M', cant: 1, total: 5000 }] },
            { id: 1002, fecha: '2026-09-05', cliente: 'EMPRESA CONSTRUCTORA S.A.', tipoDoc: 'FACTURA', formaPago: 'TARJETA_CREDITO', total: 450000, productos: [{ sku: 'MTR-001', nombre: 'MATERIALES VARIOS', cant: 10, total: 450000 }] }
        ];

        const formatearMoneda = (valor) => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(valor);

        const HistorialDirectas = () => {
            const [ventas, setVentas] = useState([]);
            
            // Cargar de localStorage
            useEffect(() => {
                if (!localStorage.getItem('erp_ventas')) {
                    localStorage.setItem('erp_ventas', JSON.stringify(MOCK_VENTAS_DIRECTAS));
                }
                const dataLocal = JSON.parse(localStorage.getItem('erp_ventas') || '[]');
                setVentas(dataLocal.filter(v => v.formaPago !== 'CREDITO_30_DIAS'));
            }, []);
            
            // Filtros
            const [busqueda, setBusqueda] = useState('');
            const [filtroDoc, setFiltroDoc] = useState('TODOS');
            const [fechaInicio, setFechaInicio] = useState('');
            const [fechaFin, setFechaFin] = useState('');
            
            const [modalDetalle, setModalDetalle] = useState(null);

            const ventasFiltradas = useMemo(() => {
                return ventas.filter(v => {
                    const matchBusqueda = v.id.toString().includes(busqueda) || v.cliente.toLowerCase().includes(busqueda.toLowerCase());
                    const matchDoc = filtroDoc === 'TODOS' || v.tipoDoc === filtroDoc;
                    
                    let matchFecha = true;
                    if (fechaInicio) matchFecha = matchFecha && v.fecha >= fechaInicio;
                    if (fechaFin) matchFecha = matchFecha && v.fecha <= fechaFin;

                    return matchBusqueda && matchDoc && matchFecha;
                });
            }, [ventas, busqueda, filtroDoc, fechaInicio, fechaFin]);

            const anularVenta = (id) => {
                if (window.confirm('¿Está seguro que desea ANULAR esta venta?\n\nAl confirmar, la venta quedará marcada como ANULADA, se devolverá el stock y se generarán los asientos de reversa contable correspondientes.')) {
                    let todas = JSON.parse(localStorage.getItem('erp_ventas') || '[]');
                    const index = todas.findIndex(v => v.id === id);
                    if (index !== -1) {
                        const venta = todas[index];
                        venta.estadoPago = 'ANULADA';
                        
                        const ts = new Date().toISOString();
                        const usr = 'María (Jefatura Ventas)';
                        venta.historialCambios = venta.historialCambios || [];
                        venta.historialCambios.push({ fecha: ts, usuario: usr, accion: 'Anulación de documento' });

                        // Devolver Stock y Movimientos
                        let dbProd = JSON.parse(localStorage.getItem('erp_productos') || '[]');
                        let movs = JSON.parse(localStorage.getItem('erp_movimientos_inventario') || '[]');
                        venta.productos.forEach(p => {
                            const idx = dbProd.findIndex(x => x.sku === p.sku);
                            if(idx !== -1) dbProd[idx].stock += p.cant;
                            movs.push({
                                id: Date.now() + Math.random(),
                                fecha: ts, sku: p.sku, nombre: p.nombre, tipo: 'ENTRADA', cantidad: p.cant,
                                motivo: `Anulación Venta #${venta.id}`, usuario: usr
                            });
                        });
                        localStorage.setItem('erp_productos', JSON.stringify(dbProd));
                        localStorage.setItem('erp_movimientos_inventario', JSON.stringify(movs));

                        // Reversa Contable
                        let asientos = JSON.parse(localStorage.getItem('erp_asientos_contables') || '[]');
                        const cuentaDebe = venta.formaPago === 'CREDITO_30_DIAS' ? 'Clientes (CxC)' : 'Caja/Bancos';
                        const base = venta.totalesDesglose ? venta.totalesDesglose.base : (venta.total / 1.19);
                        const imp = venta.totalesDesglose ? venta.totalesDesglose.impuestos : (venta.total - base);
                        const costo = venta.costoTotal || 0;

                        asientos.push({
                            id: Date.now(), fecha: ts, referencia: `Reversa Venta #${venta.id} (Anulación)`,
                            detalles: [
                                { cuenta: cuentaDebe, debe: 0, haber: venta.total },
                                { cuenta: 'Ingresos por Ventas', debe: base, haber: 0 },
                                { cuenta: 'IVA Débito Fiscal', debe: imp, haber: 0 }
                            ], usuario: usr
                        });
                        if (costo > 0) {
                            asientos.push({
                                id: Date.now()+1, fecha: ts, referencia: `Reversa Costo Venta #${venta.id} (Anulación)`,
                                detalles: [
                                    { cuenta: 'Costo de Ventas', debe: 0, haber: costo },
                                    { cuenta: 'Inventario de Mercaderías', debe: costo, haber: 0 }
                                ], usuario: usr
                            });
                        }
                        localStorage.setItem('erp_asientos_contables', JSON.stringify(asientos));

                        localStorage.setItem('erp_ventas', JSON.stringify(todas));
                        setVentas(todas.filter(v => v.formaPago !== 'CREDITO_30_DIAS'));
                        setModalDetalle(todas[index]);
                    }
                }
            };

            const reactivarVenta = (id) => {
                if (window.confirm('¿Está seguro que desea REACTIVAR esta venta?\n\nVolverá a figurar como ingreso válido, se descontará nuevamente el stock y se generarán los asientos contables.')) {
                    let todas = JSON.parse(localStorage.getItem('erp_ventas') || '[]');
                    const index = todas.findIndex(v => v.id === id);
                    if (index !== -1) {
                        const venta = todas[index];
                        venta.estadoPago = 'PAGADO';
                        
                        const ts = new Date().toISOString();
                        const usr = 'María (Jefatura Ventas)';
                        venta.historialCambios = venta.historialCambios || [];
                        venta.historialCambios.push({ fecha: ts, usuario: usr, accion: 'Reactivación de documento' });

                        // Descontar Stock y Movimientos
                        let dbProd = JSON.parse(localStorage.getItem('erp_productos') || '[]');
                        let movs = JSON.parse(localStorage.getItem('erp_movimientos_inventario') || '[]');
                        venta.productos.forEach(p => {
                            const idx = dbProd.findIndex(x => x.sku === p.sku);
                            if(idx !== -1) dbProd[idx].stock -= p.cant; // Vuelve a descontar
                            movs.push({
                                id: Date.now() + Math.random(),
                                fecha: ts, sku: p.sku, nombre: p.nombre, tipo: 'SALIDA', cantidad: p.cant,
                                motivo: `Reactivación Venta #${venta.id}`, usuario: usr
                            });
                        });
                        localStorage.setItem('erp_productos', JSON.stringify(dbProd));
                        localStorage.setItem('erp_movimientos_inventario', JSON.stringify(movs));

                        // Regenerar Contabilidad
                        let asientos = JSON.parse(localStorage.getItem('erp_asientos_contables') || '[]');
                        const cuentaDebe = venta.formaPago === 'CREDITO_30_DIAS' ? 'Clientes (CxC)' : 'Caja/Bancos';
                        const base = venta.totalesDesglose ? venta.totalesDesglose.base : (venta.total / 1.19);
                        const imp = venta.totalesDesglose ? venta.totalesDesglose.impuestos : (venta.total - base);
                        const costo = venta.costoTotal || 0;

                        asientos.push({
                            id: Date.now(), fecha: ts, referencia: `Venta #${venta.id} (Reactivación)`,
                            detalles: [
                                { cuenta: cuentaDebe, debe: venta.total, haber: 0 },
                                { cuenta: 'Ingresos por Ventas', debe: 0, haber: base },
                                { cuenta: 'IVA Débito Fiscal', debe: 0, haber: imp }
                            ], usuario: usr
                        });
                        if (costo > 0) {
                            asientos.push({
                                id: Date.now()+1, fecha: ts, referencia: `Costo de Venta #${venta.id} (Reactivación)`,
                                detalles: [
                                    { cuenta: 'Costo de Ventas', debe: costo, haber: 0 },
                                    { cuenta: 'Inventario de Mercaderías', debe: 0, haber: costo }
                                ], usuario: usr
                            });
                        }
                        localStorage.setItem('erp_asientos_contables', JSON.stringify(asientos));

                        localStorage.setItem('erp_ventas', JSON.stringify(todas));
                        setVentas(todas.filter(v => v.formaPago !== 'CREDITO_30_DIAS'));
                        setModalDetalle(todas[index]);
                    }
                }
            };

            const imprimirDocumento = (venta) => {
                const printWindow = window.open('', '_blank');
                
                let estadoImpresion = venta.estadoPago;
                if(estadoImpresion === 'PAGADO') estadoImpresion = 'PAGADA';
                
                let productosHTML = venta.productos.map(p => `
                    <tr>
                        <td style="padding: 8px; border-bottom: 1px solid #ddd;">${p.nombre}</td>
                        <td style="padding: 8px; border-bottom: 1px solid #ddd; text-align: center;">${p.cant || 1}</td>
                        <td style="padding: 8px; border-bottom: 1px solid #ddd; text-align: right;">${formatearMoneda(p.total)}</td>
                    </tr>
                `).join('');

                const htmlContent = `
                    <html>
                    <head>
                        <title>Comprobante ${venta.tipoDoc} #${venta.id}</title>
                        <style>
                            body { font-family: 'Helvetica', 'Arial', sans-serif; padding: 40px; color: #333; max-width: 800px; margin: 0 auto; }
                            .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 20px; margin-bottom: 30px; }
                            .estado-badge { display: inline-block; padding: 5px 15px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-top: 10px; }
                            .estado-PAGADA { background-color: #dcfce7; color: #166534; }
                            .estado-ANULADA { background-color: #fee2e2; color: #991b1b; }
                            .details { display: flex; justify-content: space-between; margin-bottom: 30px; background: #f8fafc; padding: 20px; border-radius: 8px; }
                            table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
                            th { background-color: #f1f5f9; padding: 12px 8px; text-align: left; font-size: 14px; border-bottom: 2px solid #cbd5e1; }
                            .totals { text-align: right; font-size: 18px; font-weight: bold; }
                            .total-final { font-size: 24px; color: #1e40af; margin-top: 10px; }
                        </style>
                    </head>
                    <body>
                        <div class="header">
                            <h1>${venta.tipoDoc} ELECTRÓNICA Nº ${venta.id}</h1>
                            <p>ERP Corporativo - Módulo Ventas</p>
                            <div class="estado-badge estado-${estadoImpresion}">ESTADO: ${estadoImpresion}</div>
                        </div>
                        <div class="details">
                            <div>
                                <strong>Cliente:</strong> ${venta.cliente}<br>
                                <strong>RUT:</strong> ${venta.rut || '---'}
                            </div>
                            <div style="text-align: right;">
                                <strong>Fecha Emisión:</strong> ${venta.fecha}<br>
                                <strong>Condición de Pago:</strong> ${venta.formaPago.replace('_', ' ')}
                            </div>
                        </div>
                        <table>
                            <thead>
                                <tr><th>Descripción del Producto</th><th style="text-align: center;">Cantidad</th><th style="text-align: right;">Subtotal</th></tr>
                            </thead>
                            <tbody>${productosHTML}</tbody>
                        </table>
                        <div class="totals">
                            Total Documento:<br>
                            <div class="total-final">${formatearMoneda(venta.total)}</div>
                        </div>
                        <script>
                            window.onload = function() { window.print(); }
                        <\/script>
                    </body>
                    </html>
                `;
                printWindow.document.open();
                printWindow.document.write(htmlContent);
                printWindow.document.close();
            };

            return (
                <div className="max-w-7xl mx-auto py-8 px-4">
                    <header className="mb-6 flex justify-between items-end border-b pb-4">
                        <div>
                            <h1 className="text-3xl font-bold text-slate-800">Historial de Ventas Directas</h1>
                            <p className="text-slate-500 mt-1">Módulo Ventas - Consulta y anulación de Boletas/Facturas pagadas al contado</p>
                        </div>
                    </header>

                    {/* PANEL DE FILTROS AVANZADOS */}
                    <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6">
                        <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Filtros de Búsqueda</h3>
                        <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Buscar (N° Doc o Cliente)</label>
                                <input type="text" value={busqueda} onChange={e => setBusqueda(e.target.value)} placeholder="Ej: 1001 o Municipalidad" className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500" />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Tipo de Documento</label>
                                <select value={filtroDoc} onChange={e => setFiltroDoc(e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 bg-white">
                                    <option value="TODOS">Todos los Documentos</option>
                                    <option value="BOLETA">Solo Boletas</option>
                                    <option value="FACTURA">Solo Facturas</option>
                                </select>
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Fecha Desde</label>
                                <input type="date" value={fechaInicio} onChange={e => setFechaInicio(e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500" />
                            </div>
                            <div>
                                <label className="block text-xs font-semibold text-slate-600 mb-1">Fecha Hasta</label>
                                <input type="date" value={fechaFin} onChange={e => setFechaFin(e.target.value)} className="w-full p-2 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500" />
                            </div>
                        </div>
                    </div>

                    {/* TABLA DE RESULTADOS */}
                    <div className="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
                        <div className="overflow-x-auto">
                            <table className="min-w-full text-sm text-left">
                                <thead className="bg-indigo-50 text-indigo-900 uppercase text-xs font-bold border-b border-indigo-100">
                                    <tr>
                                        <th className="px-6 py-4">N° Doc</th>
                                        <th className="px-6 py-4">Fecha</th>
                                        <th className="px-6 py-4">Cliente</th>
                                        <th className="px-6 py-4">Método de Pago</th>
                                        <th className="px-6 py-4 text-right">Monto Pagado</th>
                                        <th className="px-6 py-4 text-center">Estado</th>
                                        <th className="px-6 py-4 text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100">
                                    {ventasFiltradas.map(v => {
                                        const esAnulada = v.estadoPago === 'ANULADA';
                                        return (
                                            <tr key={v.id} className={`hover:bg-slate-50 transition-colors ${esAnulada ? 'opacity-60 bg-red-50/30' : ''}`}>
                                                <td className="px-6 py-4 font-mono font-bold text-slate-700">
                                                    <span className={v.tipoDoc === 'FACTURA' ? 'text-blue-600' : 'text-emerald-600'}>{v.tipoDoc.substring(0,3)}</span>-{v.id}
                                                </td>
                                                <td className="px-6 py-4 text-slate-500 whitespace-nowrap">{v.fecha}</td>
                                                <td className="px-6 py-4 font-semibold text-slate-800">{v.cliente}</td>
                                                <td className="px-6 py-4 font-mono text-xs text-slate-500 bg-slate-50 rounded px-2 inline-block mt-3">{v.formaPago.replace('_', ' ')}</td>
                                                <td className="px-6 py-4 text-right font-bold text-indigo-700">
                                                    {esAnulada ? <span className="line-through text-slate-400">{formatearMoneda(v.total)}</span> : formatearMoneda(v.total)}
                                                </td>
                                                <td className="px-6 py-4 text-center">
                                                    {esAnulada 
                                                        ? <span className="bg-red-100 text-red-800 text-xs font-bold px-3 py-1 rounded-full">ANULADA</span>
                                                        : <span className="bg-green-100 text-green-800 text-xs font-bold px-3 py-1 rounded-full">VÁLIDA</span>
                                                    }
                                                </td>
                                                <td className="px-6 py-4 text-center">
                                                    <button onClick={() => setModalDetalle(v)} className="bg-indigo-100 text-indigo-700 hover:bg-indigo-200 font-bold py-1.5 px-4 rounded shadow-sm transition-colors text-xs">
                                                        Ver Detalle
                                                    </button>
                                                </td>
                                            </tr>
                                        )
                                    })}
                                    {ventasFiltradas.length === 0 && (
                                        <tr><td colSpan="7" className="p-12 text-center text-slate-400 font-medium text-lg">No se encontraron ventas que coincidan con los filtros.</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    {/* MODAL: DETALLE Y ANULACIÓN */}
                    {modalDetalle && (
                        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
                            <div className="bg-white rounded-2xl shadow-2xl p-0 w-full max-w-2xl max-h-[90vh] overflow-hidden flex flex-col">
                                <div className={`p-6 text-white ${modalDetalle.estadoPago === 'ANULADA' ? 'bg-red-900' : 'bg-indigo-900'}`}>
                                    <h3 className="text-2xl font-bold mb-1 flex items-center justify-between">
                                        <span>Documento {modalDetalle.tipoDoc} #{modalDetalle.id}</span>
                                        {modalDetalle.estadoPago === 'ANULADA' 
                                            ? <span className="bg-red-500 text-white text-xs px-3 py-1 rounded-full uppercase tracking-wider font-bold shadow">Anulada NULA</span>
                                            : <span className="bg-green-500 text-white text-xs px-3 py-1 rounded-full uppercase tracking-wider font-bold shadow">Pagado Totalmente</span>
                                        }
                                    </h3>
                                    <p className="text-indigo-200 text-sm">{modalDetalle.fecha} — {modalDetalle.formaPago.replace('_', ' ')}</p>
                                </div>
                                
                                <div className="p-6 overflow-y-auto relative">
                                    {modalDetalle.estadoPago === 'ANULADA' && (
                                        <div className="absolute inset-0 flex items-center justify-center pointer-events-none opacity-10 z-0">
                                            <span className="text-9xl font-black text-red-600 rotate-[-15deg] whitespace-nowrap">ANULADA</span>
                                        </div>
                                    )}
                                    <div className="mb-6 bg-slate-50 p-4 rounded-lg border border-slate-200 relative z-10">
                                        <span className="text-xs text-slate-400 font-bold uppercase block mb-1">A nombre de:</span>
                                        <span className="text-lg font-bold text-slate-800">{modalDetalle.cliente}</span>
                                    </div>
                                    
                                    <table className="w-full text-sm text-left border rounded overflow-hidden relative z-10">
                                        <thead className="bg-slate-100 text-slate-600 font-bold border-b">
                                            <tr><th className="p-3">Código</th><th className="p-3">Descripción</th><th className="p-3 text-center">Cant.</th><th className="p-3 text-right">Subtotal</th></tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {modalDetalle.productos.map((p, i) => (
                                                <tr key={i} className="hover:bg-slate-50">
                                                    <td className="p-3 font-mono text-slate-400 text-xs">{p.sku}</td>
                                                    <td className="p-3 font-semibold">{p.nombre}</td>
                                                    <td className="p-3 text-center font-bold">{p.cant}</td>
                                                    <td className="p-3 text-right font-mono font-bold text-indigo-700">{formatearMoneda(p.total)}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                <div className="p-6 bg-slate-50 border-t border-slate-200 flex justify-between items-center">
                                    <div>
                                        <div className="text-xs font-bold text-slate-400 uppercase tracking-widest">Total Cancelado</div>
                                        <div className={`text-3xl font-black ${modalDetalle.estadoPago === 'ANULADA' ? 'text-red-700 line-through' : 'text-slate-800'}`}>{formatearMoneda(modalDetalle.total)}</div>
                                    </div>
                                    <div className="flex gap-3">
                                        <button onClick={() => imprimirDocumento(modalDetalle)} className="bg-slate-800 hover:bg-slate-900 text-white font-bold py-2.5 px-5 rounded-lg transition-colors shadow flex items-center gap-2">
                                            <span>🖨️</span> Imprimir
                                        </button>
                                        {modalDetalle.estadoPago === 'ANULADA' ? (
                                            <button onClick={() => reactivarVenta(modalDetalle.id)} className="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-5 rounded-lg transition-colors shadow flex items-center gap-2">
                                                <span>🔄</span> Reactivar Venta
                                            </button>
                                        ) : (
                                            <button onClick={() => anularVenta(modalDetalle.id)} className="bg-red-500 hover:bg-red-600 text-white font-bold py-2.5 px-5 rounded-lg transition-colors shadow flex items-center gap-2">
                                                <span>🗑️</span> Anular Venta
                                            </button>
                                        )}
                                        <button onClick={() => setModalDetalle(null)} className="bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-bold py-2.5 px-5 rounded-lg transition-colors">
                                            Cerrar
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HistorialDirectas />);
    </script>
</body>
</html>
