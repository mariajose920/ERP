<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP Corporativo</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans flex items-center justify-center">
    <div class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200 w-full max-w-md">
        <div class="text-center mb-8">
            <span class="text-4xl">🏢</span>
            <h1 class="text-2xl font-bold text-slate-800 mt-2">ERP Corporativo</h1>
            <p class="text-sm text-slate-500 mt-1">Inicie sesión para continuar</p>
        </div>
        
        <form id="login-form" class="space-y-4">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Usuario / Email</label>
                <input type="email" id="email" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="admin@erp.com" required>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <input type="password" id="password" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500" placeholder="••••••••" required>
            </div>
            
            <div class="text-red-500 text-sm hidden" id="error-msg">
                Credenciales incorrectas.
            </div>
            
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">
                Ingresar al Sistema
            </button>
        </form>

        <div class="mt-6 p-4 bg-indigo-50 rounded-lg border border-indigo-100">
            <h3 class="text-xs font-bold text-indigo-800 mb-2">Credenciales de Acceso:</h3>
            <p class="text-xs text-slate-600"><strong>Usuario:</strong> admin@erp.com</p>
            <p class="text-xs text-slate-600"><strong>Contraseña:</strong> Admin123!</p>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (email === 'admin@erp.com' && password === 'Admin123!') {
                localStorage.setItem('isAuthenticated', 'true');
                window.location.href = 'index_erp.html';
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
