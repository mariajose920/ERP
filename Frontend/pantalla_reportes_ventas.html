<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes de Ventas - ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
    
    <!-- NAVBAR RESPONSIVA -->
    <nav class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">🏢</span>
                    <span class="font-bold text-xl tracking-wider hidden lg:block">ERP CORPORATIVO</span>
                </div>
                <div class="hidden lg:block">
                    <div class="ml-10 flex items-baseline space-x-2" id="desktop-menu">
                        <a href="index_erp.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white transition-colors" data-path="index_erp.html">🏠 Inicio</a>
                        <a href="pantalla_emision_ventas.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white transition-colors">🧾 POS Ventas</a>
                        <a href="pantalla_reportes_ventas.html" class="nav-link px-3 py-2 rounded-md text-sm font-medium text-indigo-200 hover:bg-indigo-600 hover:text-white transition-colors bg-indigo-700 text-white" data-path="pantalla_reportes_ventas.html">📊 Reportes</a>
                    </div>
                </div>
                <div class="lg:hidden">
                    <button id="mobile-menu-btn" class="inline-flex items-center justify-center p-2 rounded-md text-indigo-200 hover:text-white hover:bg-indigo-700 focus:outline-none">
                        <svg class="h-6 w-6" stroke="currentColor" fill="none" viewBox="0 0 24 24">
                            <path id="icon-menu" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const formatearMoneda = (valor) => new Intl.NumberFormat('es-CL', { style: 'currency', currency: 'CLP', maximumFractionDigits: 0 }).format(valor);
        const formatearFecha = (fecha) => new Date(fecha).toLocaleDateString('es-CL');

        const ReportesDashboard = () => {
            const [ventas, setVentas] = useState([]);
            const [tabActiva, setTabActiva] = useState('RANKING_CLIENTES');

            // Filtros Historial
            const [filtroFechaIni, setFiltroFechaIni] = useState('');
            const [filtroFechaFin, setFiltroFechaFin] = useState('');
            const [filtroCliente, setFiltroCliente] = useState('');
            const [filtroEstado, setFiltroEstado] = useState('');

            useEffect(() => {
                const data = JSON.parse(localStorage.getItem('erp_ventas') || '[]');
                setVentas(data);
            }, []);

            // 1. Ranking de Clientes
            const rankingClientes = useMemo(() => {
                const ventasValidas = ventas.filter(v => v.estadoPago !== 'ANULADA');
                const granTotal = ventasValidas.reduce((sum, v) => sum + v.total, 0);
                
                let agrupado = {};
                ventasValidas.forEach(v => {
                    const clave = v.rut || 'GENÉRICO';
                    if(!agrupado[clave]) agrupado[clave] = { rut: clave, nombre: v.cliente, total: 0, cantVentas: 0 };
                    agrupado[clave].total += v.total;
                    agrupado[clave].cantVentas += 1;
                });

                return Object.values(agrupado)
                    .sort((a, b) => b.total - a.total)
                    .map(c => ({ ...c, porcentaje: granTotal > 0 ? ((c.total / granTotal) * 100).toFixed(1) : 0 }));
            }, [ventas]);

            // 2. Ventas por Producto
            const rankingProductos = useMemo(() => {
                const ventasValidas = ventas.filter(v => v.estadoPago !== 'ANULADA');
                let agrupado = {};
                
                ventasValidas.forEach(v => {
                    v.productos.forEach(p => {
                        if(!agrupado[p.sku]) agrupado[p.sku] = { sku: p.sku, nombre: p.nombre, unidades: 0, ingresos: 0, categoria: p.sku.split('-')[0] };
                        agrupado[p.sku].unidades += p.cant;
                        agrupado[p.sku].ingresos += p.total;
                    });
                });

                return Object.values(agrupado).sort((a, b) => b.ingresos - a.ingresos);
            }, [ventas]);

            // 3. Cuentas por Cobrar (CxC)
            const cuentasPorCobrar = useMemo(() => {
                const pendientes = ventas.filter(v => v.formaPago === 'CREDITO_30_DIAS' && v.estadoPago === 'PENDIENTE');
                const hoy = new Date();
                
                return pendientes.map(v => {
                    const fechaEmision = new Date(v.fecha);
                    const fechaVto = new Date(fechaEmision);
                    fechaVto.setDate(fechaVto.getDate() + 30);
                    
                    const diferenciaTiempo = hoy.getTime() - fechaVto.getTime();
                    const diasMora = Math.floor(diferenciaTiempo / (1000 * 3600 * 24));
                    
                    const pagado = v.productos.reduce((s, p) => s + (p.pagado || 0), 0);
                    const saldo = v.total - pagado;

                    return { ...v, fechaVto, diasMora: diasMora > 0 ? diasMora : 0, saldo };
                }).sort((a, b) => b.diasMora - a.diasMora); // Mayor mora primero
            }, [ventas]);

            // 4. Historial Avanzado
            const historialFiltrado = useMemo(() => {
                return ventas.filter(v => {
                    let match = true;
                    if(filtroFechaIni && v.fecha < filtroFechaIni) match = false;
                    if(filtroFechaFin && v.fecha > filtroFechaFin) match = false;
                    if(filtroCliente && !v.cliente.toLowerCase().includes(filtroCliente.toLowerCase())) match = false;
                    if(filtroEstado && v.estadoPago !== filtroEstado) match = false;
                    return match;
                });
            }, [ventas, filtroFechaIni, filtroFechaFin, filtroCliente, filtroEstado]);


            return (
                <div className="max-w-7xl mx-auto py-8 px-4">
                    <header className="mb-6">
                        <h1 className="text-3xl font-bold text-slate-800 tracking-tight">Centro de Reportes y Analítica</h1>
                        <p className="text-slate-500 mt-1 font-medium">Módulo Ventas - Inteligencia de Negocios</p>
                    </header>

                    {/* TABS */}
                    <div className="flex space-x-1 bg-slate-200 p-1 rounded-xl mb-6 overflow-x-auto">
                        <button onClick={() => setTabActiva('RANKING_CLIENTES')} className={`px-4 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap transition-colors ${tabActiva === 'RANKING_CLIENTES' ? 'bg-white text-indigo-900 shadow' : 'text-slate-600 hover:bg-slate-300'}`}>🏆 Ranking Clientes</button>
                        <button onClick={() => setTabActiva('PRODUCTOS')} className={`px-4 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap transition-colors ${tabActiva === 'PRODUCTOS' ? 'bg-white text-indigo-900 shadow' : 'text-slate-600 hover:bg-slate-300'}`}>📦 Ventas por Producto</button>
                        <button onClick={() => setTabActiva('CXC')} className={`px-4 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap transition-colors ${tabActiva === 'CXC' ? 'bg-white text-indigo-900 shadow' : 'text-slate-600 hover:bg-slate-300'}`}>🚨 Cuentas por Cobrar (CxC)</button>
                        <button onClick={() => setTabActiva('HISTORIAL')} className={`px-4 py-2.5 rounded-lg text-sm font-bold whitespace-nowrap transition-colors ${tabActiva === 'HISTORIAL' ? 'bg-white text-indigo-900 shadow' : 'text-slate-600 hover:bg-slate-300'}`}>📋 Historial Avanzado</button>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                        
                        {/* CONTENIDO 1: RANKING CLIENTES */}
                        {tabActiva === 'RANKING_CLIENTES' && (
                            <div>
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><span>🏆</span> Mejores Clientes (Ventas Totales)</h2>
                                <div className="space-y-4">
                                    {rankingClientes.length === 0 ? <p className="text-slate-500">No hay datos suficientes.</p> : null}
                                    {rankingClientes.map((c, i) => (
                                        <div key={c.rut} className="flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 bg-slate-50 rounded-xl border border-slate-100 gap-4">
                                            <div className="flex items-center gap-4 w-full sm:w-1/3">
                                                <div className="text-2xl font-black text-slate-300 w-8">#{i+1}</div>
                                                <div>
                                                    <div className="font-bold text-slate-800 text-sm">{c.nombre}</div>
                                                    <div className="text-xs text-slate-500 font-mono">{c.rut} | {c.cantVentas} docs</div>
                                                </div>
                                            </div>
                                            <div className="w-full sm:w-1/3 flex items-center gap-2">
                                                <div className="w-full bg-slate-200 rounded-full h-2.5">
                                                    <div className="bg-indigo-600 h-2.5 rounded-full" style={{ width: `${c.porcentaje}%` }}></div>
                                                </div>
                                                <span className="text-xs font-bold text-slate-600 w-12 text-right">{c.porcentaje}%</span>
                                            </div>
                                            <div className="w-full sm:w-1/3 text-left sm:text-right font-mono font-black text-indigo-700 text-lg">
                                                {formatearMoneda(c.total)}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* CONTENIDO 2: PRODUCTOS */}
                        {tabActiva === 'PRODUCTOS' && (
                            <div>
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><span>📦</span> Desempeño por Producto y SKU</h2>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-100 text-slate-600 font-bold border-b">
                                            <tr>
                                                <th className="p-3">Categoría (Prefijo)</th>
                                                <th className="p-3">SKU</th>
                                                <th className="p-3">Producto</th>
                                                <th className="p-3 text-center">Unid. Vendidas</th>
                                                <th className="p-3 text-right">Ingresos Generados</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {rankingProductos.map(p => (
                                                <tr key={p.sku} className="hover:bg-slate-50">
                                                    <td className="p-3"><span className="px-2 py-1 bg-slate-200 text-slate-700 rounded text-xs font-bold">{p.categoria}</span></td>
                                                    <td className="p-3 font-mono text-slate-500">{p.sku}</td>
                                                    <td className="p-3 font-bold text-slate-700">{p.nombre}</td>
                                                    <td className="p-3 text-center font-bold text-indigo-600">{p.unidades}</td>
                                                    <td className="p-3 text-right font-mono font-bold">{formatearMoneda(p.ingresos)}</td>
                                                </tr>
                                            ))}
                                            {rankingProductos.length === 0 && (
                                                <tr><td colSpan="5" className="p-8 text-center text-slate-400">Sin datos registrados.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* CONTENIDO 3: CXC */}
                        {tabActiva === 'CXC' && (
                            <div>
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><span>🚨</span> Cuentas por Cobrar (Facturas a Plazo Pendientes)</h2>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                    <div className="bg-rose-50 border border-rose-100 p-4 rounded-xl">
                                        <div className="text-rose-500 text-xs font-bold uppercase mb-1">Deuda Total Acumulada</div>
                                        <div className="text-2xl font-black text-rose-700">{formatearMoneda(cuentasPorCobrar.reduce((s, c) => s + c.saldo, 0))}</div>
                                    </div>
                                    <div className="bg-amber-50 border border-amber-100 p-4 rounded-xl">
                                        <div className="text-amber-600 text-xs font-bold uppercase mb-1">Documentos en Mora (>0 días)</div>
                                        <div className="text-2xl font-black text-amber-700">{cuentasPorCobrar.filter(c => c.diasMora > 0).length} Docs</div>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-100 text-slate-600 font-bold border-b">
                                            <tr>
                                                <th className="p-3">Doc #</th>
                                                <th className="p-3">Cliente</th>
                                                <th className="p-3">Emisión</th>
                                                <th className="p-3">Vencimiento</th>
                                                <th className="p-3 text-center">Días Mora</th>
                                                <th className="p-3 text-right">Saldo Pendiente</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {cuentasPorCobrar.map(c => (
                                                <tr key={c.id} className="hover:bg-slate-50">
                                                    <td className="p-3 font-mono font-bold">{c.id}</td>
                                                    <td className="p-3 font-bold text-slate-700">{c.cliente}</td>
                                                    <td className="p-3">{c.fecha}</td>
                                                    <td className="p-3 font-bold">{formatearFecha(c.fechaVto)}</td>
                                                    <td className="p-3 text-center">
                                                        {c.diasMora > 0 ? (
                                                            <span className="bg-red-100 text-red-700 px-2 py-1 rounded-full font-bold text-xs">{c.diasMora} días</span>
                                                        ) : (
                                                            <span className="bg-green-100 text-green-700 px-2 py-1 rounded-full font-bold text-xs">Al día</span>
                                                        )}
                                                    </td>
                                                    <td className="p-3 text-right font-mono font-bold text-rose-600">{formatearMoneda(c.saldo)}</td>
                                                </tr>
                                            ))}
                                            {cuentasPorCobrar.length === 0 && (
                                                <tr><td colSpan="6" className="p-8 text-center text-slate-400">Excelente, no hay deudas pendientes.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {/* CONTENIDO 4: HISTORIAL AVANZADO */}
                        {tabActiva === 'HISTORIAL' && (
                            <div>
                                <h2 className="text-lg font-bold text-slate-800 mb-4 flex items-center gap-2"><span>📋</span> Historial Maestro de Ventas</h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 p-4 bg-slate-50 rounded-xl border border-slate-100">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Desde</label>
                                        <input type="date" value={filtroFechaIni} onChange={e => setFiltroFechaIni(e.target.value)} className="w-full p-2 border rounded" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Hasta</label>
                                        <input type="date" value={filtroFechaFin} onChange={e => setFiltroFechaFin(e.target.value)} className="w-full p-2 border rounded" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Cliente</label>
                                        <input type="text" placeholder="Buscar..." value={filtroCliente} onChange={e => setFiltroCliente(e.target.value)} className="w-full p-2 border rounded" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 mb-1">Estado</label>
                                        <select value={filtroEstado} onChange={e => setFiltroEstado(e.target.value)} className="w-full p-2 border rounded">
                                            <option value="">Todos</option>
                                            <option value="PAGADO">PAGADO</option>
                                            <option value="PENDIENTE">PENDIENTE</option>
                                            <option value="ANULADA">ANULADA</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm text-left">
                                        <thead className="bg-slate-100 text-slate-600 font-bold border-b">
                                            <tr>
                                                <th className="p-3">Doc</th>
                                                <th className="p-3">Fecha Emisión</th>
                                                <th className="p-3">Cliente</th>
                                                <th className="p-3">Estado</th>
                                                <th className="p-3">Responsable (Auditoría)</th>
                                                <th className="p-3 text-right">Total</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {historialFiltrado.map(v => (
                                                <tr key={v.id} className="hover:bg-slate-50">
                                                    <td className="p-3 font-mono font-bold text-indigo-600">{v.tipoDoc[0]}-{v.id}</td>
                                                    <td className="p-3">{v.fecha}</td>
                                                    <td className="p-3 font-bold text-slate-700">{v.cliente}</td>
                                                    <td className="p-3">
                                                        <span className={`px-2 py-1 rounded text-xs font-bold ${v.estadoPago === 'ANULADA' ? 'bg-red-100 text-red-700' : v.estadoPago === 'PENDIENTE' ? 'bg-amber-100 text-amber-700' : 'bg-green-100 text-green-700'}`}>
                                                            {v.estadoPago}
                                                        </span>
                                                    </td>
                                                    <td className="p-3 text-xs text-slate-500">
                                                        {v.historialCambios && v.historialCambios[0] ? (
                                                            <span>👤 {v.historialCambios[0].usuario}<br/><i>{new Date(v.historialCambios[0].fecha).toLocaleString('es-CL')}</i></span>
                                                        ) : '---'}
                                                    </td>
                                                    <td className={`p-3 text-right font-mono font-bold ${v.estadoPago === 'ANULADA' ? 'text-slate-400 line-through' : ''}`}>
                                                        {formatearMoneda(v.total)}
                                                    </td>
                                                </tr>
                                            ))}
                                            {historialFiltrado.length === 0 && (
                                                <tr><td colSpan="6" className="p-8 text-center text-slate-400">No hay registros que coincidan con los filtros.</td></tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ReportesDashboard />);
    </script>
</body>
</html>
