<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auditoría de Eventos - ERP</title>
    <!-- Carga de Tailwind CSS idéntica a las otras pantallas -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="erp-sync.js"></script>
    <script>
        // Validación de sesión
        if (localStorage.getItem('isAuthenticated') !== 'true') {
            window.location.href = 'login.html';
        }

        function logout() {
            localStorage.removeItem('isAuthenticated');
            localStorage.removeItem('token');
            window.location.href = 'login.html';
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <!-- NAVBAR RESPONSIVA UNIFICADA (Asegúrate de copiar el mismo nav de las otras pantallas si tienes uno más completo) -->
    <nav class="bg-indigo-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
            <div class="font-bold text-xl">ERP Corporativo - Auditoría</div>
            <button onclick="logout()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded">Cerrar Sesión</button>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 py-8">
        <h1 class="text-3xl font-bold mb-6 text-gray-800">Registro de Auditoría</h1>

        <!-- Filtros de Auditoría -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-4 mb-6 bg-white p-4 rounded shadow">
            <input type="date" id="filtroFecha" class="border p-2 rounded w-full" placeholder="Fecha">
            <input type="text" id="filtroUsuario" class="border p-2 rounded w-full" placeholder="Usuario (Email)">
            <select id="filtroModulo" class="border p-2 rounded w-full">
                <option value="">Todos los Módulos</option>
                <option value="Ventas">Ventas</option>
                <option value="Compras">Compras</option>
                <option value="Inventario">Inventario</option>
                <option value="Contabilidad">Contabilidad</option>
                <option value="Seguridad">Seguridad</option>
            </select>
            <input type="text" id="filtroAccion" class="border p-2 rounded w-full" placeholder="Acción">
            <input type="text" id="filtroEntidad" class="border p-2 rounded w-full" placeholder="Entidad">
            
            <button onclick="cargarAuditoria()" class="bg-blue-600 text-white p-2 rounded col-span-1 md:col-span-5 hover:bg-blue-700 transition-colors">
                Aplicar Filtros
            </button>
        </div>

        <!-- Tabla de Resultados -->
        <div class="overflow-x-auto bg-white rounded shadow">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-gray-100 text-gray-700 border-b">
                        <th class="p-3">Fecha y Hora</th>
                        <th class="p-3">Usuario</th>
                        <th class="p-3">Módulo</th>
                        <th class="p-3">Acción</th>
                        <th class="p-3">Entidad</th>
                        <th class="p-3">Detalles</th>
                    </tr>
                </thead>
                <tbody id="tablaAuditoriaBody">
                    <!-- Las filas se inyectarán aquí con JavaScript -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- SCRIPT DE LÓGICA -->
    <script>
        async function cargarAuditoria() {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch('http://localhost:5000/api/auditoria', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Error al obtener los datos');
                const data = await response.json();

                const fFecha = document.getElementById('filtroFecha').value;
                const fUsuario = document.getElementById('filtroUsuario').value.toLowerCase();
                const fModulo = document.getElementById('filtroModulo').value.toLowerCase();
                const fAccion = document.getElementById('filtroAccion').value.toLowerCase();
                const fEntidad = document.getElementById('filtroEntidad').value.toLowerCase();

                const dataFiltrada = data.filter(item => {
                    const cumpleFecha = fFecha ? item.fechaCreacion.startsWith(fFecha) : true;
                    const cumpleUsuario = fUsuario ? (item.usuarioEmail || '').toLowerCase().includes(fUsuario) : true;
                    const cumpleModulo = fModulo ? (item.modulo || '').toLowerCase().includes(fModulo) : true;
                    const cumpleAccion = fAccion ? (item.accion || '').toLowerCase().includes(fAccion) : true;
                    const cumpleEntidad = fEntidad ? (item.entidad || '').toLowerCase().includes(fEntidad) : true;
                    
                    return cumpleFecha && cumpleUsuario && cumpleModulo && cumpleAccion && cumpleEntidad;
                });

                const tbody = document.getElementById('tablaAuditoriaBody');
                tbody.innerHTML = ''; 

                if (dataFiltrada.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">No se encontraron registros.</td></tr>`;
                    return;
                }

                dataFiltrada.forEach(item => {
                    const fechaFormateada = new Date(item.fechaCreacion).toLocaleString('es-CL');
                    
                    const fila = document.createElement('tr');
                    fila.className = 'border-b hover:bg-gray-50';
                    fila.innerHTML = `
                        <td class="p-3">${fechaFormateada}</td>
                        <td class="p-3 font-medium">${item.usuarioEmail || 'Sistema'}</td>
                        <td class="p-3"><span class="bg-blue-100 text-blue-800 px-2 py-1 rounded text-sm">${item.modulo}</span></td>
                        <td class="p-3">${item.accion}</td>
                        <td class="p-3">${item.entidad}</td>
                        <td class="p-3 text-sm text-gray-600">${item.detalles || 'Sin detalles adicionales'}</td>
                    `;
                    tbody.appendChild(fila);
                });

            } catch (error) {
                console.error('Error al conectar con la base de datos:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', cargarAuditoria);
    </script>
</body>
</html>
